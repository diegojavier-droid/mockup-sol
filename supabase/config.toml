## Supabase local development config for Sol Mai.
## Kept minimal: only what `supabase start` / `supabase db reset` need.
## No project ref, no remote secrets committed here.

project_id = "sol-mai-local"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:8080"

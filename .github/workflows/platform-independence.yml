name: Platform independence CI

on:
  pull_request:
    branches: [main, mvp/sol-mai-v2]
    paths:
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
      - "vite.config.ts"
      - "wrangler.jsonc"
      - "src/**"
      - "server/**"
      - "scripts/**"
      - "supabase/migrations/20260724170535_catalog_bootstrap.sql"
      - ".github/workflows/platform-independence.yml"
      - ".github/workflows/cloudflare-deploy.yml"
      - ".github/workflows/supabase-schema-deploy.yml"
      - ".github/workflows/supabase-owned-smoke.yml"
  push:
    branches: [main, mvp/sol-mai-v2]
    paths:
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
      - "vite.config.ts"
      - "wrangler.jsonc"
      - "src/**"
      - "server/**"
      - "scripts/**"
      - "supabase/migrations/20260724170535_catalog_bootstrap.sql"
      - ".github/workflows/platform-independence.yml"
      - ".github/workflows/cloudflare-deploy.yml"
      - ".github/workflows/supabase-schema-deploy.yml"
      - ".github/workflows/supabase-owned-smoke.yml"

concurrency:
  group: platform-independence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build without Lovable and dry-run Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Reject Lovable lock-in and active runtime residue
        run: |
          set -euo pipefail

          LOCK_MATCHES=$(git grep -n -E 'lovable-core-prod|sandbox-npm-cache|npm\.pkg\.dev/.?lovable' -- bun.lock || true)
          if [ -n "$LOCK_MATCHES" ]; then
            echo "::error::bun.lock still references Lovable infrastructure"
            echo "$LOCK_MATCHES"
            exit 1
          fi

          ACTIVE_MATCHES=$(git grep -n -E '@lovable\.dev|__lovable|reportLovableError' -- \
            package.json bunfig.toml vite.config.ts wrangler.jsonc 'tsconfig*.json' src server scripts 2>/dev/null || true)
          if [ -n "$ACTIVE_MATCHES" ]; then
            echo "::error::Active code/config still depends on Lovable"
            echo "$ACTIVE_MATCHES"
            exit 1
          fi

          if git ls-files '.lovable/**' | grep -q .; then
            echo "::error::.lovable/ tooling is tracked again"
            git ls-files '.lovable/**'
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify catalog bootstrap generator is in sync
        run: |
          set -euo pipefail
          bun run db:generate-seed
          git diff --exit-code -- supabase/migrations/20260724170535_catalog_bootstrap.sql

      - name: Typecheck backend
        run: bun run typecheck:server

      - name: Build TanStack Start
        run: bun run build

      - name: Ensure generated route tree is committed
        run: git diff --exit-code -- src/routeTree.gen.ts

      - name: Validate Cloudflare deploy package without credentials
        run: bunx wrangler deploy --dry-run

name: Database clean-room CI

on:
  pull_request:
    branches: [main, mvp/sol-mai-v2]
    paths:
      - "supabase/**"
      - "server/**"
      - "src/integrations/supabase/**"
      - "package.json"
      - "bun.lock"
      - "tsconfig.server.json"
      - ".env.example"
      - ".gitignore"
      - ".github/workflows/database-clean-room.yml"
      - ".github/workflows/backend-scaffold.yml"
  push:
    branches: [main, mvp/sol-mai-v2]
    paths:
      - "supabase/**"
      - "server/**"
      - "src/integrations/supabase/**"
      - "package.json"
      - "bun.lock"
      - "tsconfig.server.json"
      - ".env.example"
      - ".gitignore"
      - ".github/workflows/database-clean-room.yml"
      - ".github/workflows/backend-scaffold.yml"

concurrency:
  group: database-clean-room-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clean-room:
    name: Rebuild Supabase from zero
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      NODE_ENV: test
      APP_ENV: local
      API_BASE_URL: http://localhost:3001
      PUBLIC_WEB_BASE_URL: http://localhost:8080
      INTERNAL_AUTH_JWT_AUDIENCE: sol-mai-internal
      INTERNAL_AUTH_ALLOWED_EMAILS: ci@sol-mai.test
      PORT: "3001"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Reject foreign lockfiles
        run: |
          set -euo pipefail
          for f in package-lock.json pnpm-lock.yaml yarn.lock; do
            if [ -f "$f" ]; then
              echo "::error::Foreign lockfile detected: $f. Only bun.lock is allowed."
              exit 1
            fi
          done

      - name: Install dependencies (frozen)
        run: bun install --frozen-lockfile

      - name: Start isolated local Supabase
        run: |
          set -euo pipefail
          supabase start
          supabase db reset

          supabase status -o env > /tmp/supabase.env
          set -a
          source /tmp/supabase.env
          set +a

          echo "SUPABASE_LOCAL_API_URL=$API_URL" >> "$GITHUB_ENV"
          echo "SUPABASE_LOCAL_DB_URL=$DB_URL" >> "$GITHUB_ENV"
          echo "SUPABASE_LOCAL_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_LOCAL_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"

      - name: Verify local migration ledger matches repository
        run: |
          set -euo pipefail

          find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' \
            | sed -E 's/^([0-9]+)_.*/\1/' \
            | sort > /tmp/local-migrations.txt

          psql "$SUPABASE_LOCAL_DB_URL" -Atc \
            "select version from supabase_migrations.schema_migrations order by version" \
            > /tmp/db-migrations.txt

          echo "Local migration versions:"
          cat /tmp/local-migrations.txt
          echo "Applied migration versions:"
          cat /tmp/db-migrations.txt

          diff -u /tmp/local-migrations.txt /tmp/db-migrations.txt

      - name: Capture bootstrap baseline counts
        run: |
          set -euo pipefail

          psql "$SUPABASE_LOCAL_DB_URL" -At -F '=' -c "
            select table_name, row_count
            from (
              select 'business_hours' as table_name, count(*)::int as row_count from public.business_hours
              union all select 'categories', count(*)::int from public.categories
              union all select 'extras', count(*)::int from public.extras
              union all select 'personalization_fields', count(*)::int from public.personalization_fields
              union all select 'personalization_options', count(*)::int from public.personalization_options
              union all select 'service_personalization_option_modifiers', count(*)::int from public.service_personalization_option_modifiers
              union all select 'service_personalization_rules', count(*)::int from public.service_personalization_rules
              union all select 'services', count(*)::int from public.services
            ) q
            order by table_name;
          " > /tmp/counts-before.txt

          cat > /tmp/counts-expected.txt <<'EOF'
          business_hours=4
          categories=4
          extras=13
          personalization_fields=14
          personalization_options=49
          service_personalization_option_modifiers=192
          service_personalization_rules=209
          services=43
          EOF

          echo "Counts after clean rebuild:"
          cat /tmp/counts-before.txt
          diff -u /tmp/counts-expected.txt /tmp/counts-before.txt

      - name: Execute bootstrap a second time and prove idempotency
        run: |
          set -euo pipefail

          psql "$SUPABASE_LOCAL_DB_URL" -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20260724170535_catalog_bootstrap.sql

          psql "$SUPABASE_LOCAL_DB_URL" -At -F '=' -c "
            select table_name, row_count
            from (
              select 'business_hours' as table_name, count(*)::int as row_count from public.business_hours
              union all select 'categories', count(*)::int from public.categories
              union all select 'extras', count(*)::int from public.extras
              union all select 'personalization_fields', count(*)::int from public.personalization_fields
              union all select 'personalization_options', count(*)::int from public.personalization_options
              union all select 'service_personalization_option_modifiers', count(*)::int from public.service_personalization_option_modifiers
              union all select 'service_personalization_rules', count(*)::int from public.service_personalization_rules
              union all select 'services', count(*)::int from public.services
            ) q
            order by table_name;
          " > /tmp/counts-after.txt

          echo "Counts after bootstrap #2:"
          cat /tmp/counts-after.txt
          diff -u /tmp/counts-before.txt /tmp/counts-after.txt

      - name: Verify RLS and public/internal visibility
        run: |
          set -euo pipefail

          psql "$SUPABASE_LOCAL_DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          begin;
          set local role anon;

          do $$
          declare
            n integer;
          begin
            select count(*) into n from public.categories;
            if n <> 4 then raise exception 'anon categories expected 4, got %', n; end if;

            -- 41 desde que babylights y claritos se agruparon bajo Mechas
            -- (decisión de Sol, 2026-09-12) y los 16 tratamientos nuevos
            -- entraron activos pero SIN publicar, a la espera de que ella
            -- defina las duraciones.
            select count(*) into n from public.services;
            if n <> 41 then raise exception 'anon services expected 41, got %', n; end if;

            -- Lo que el número de arriba solo no prueba: hasta ahora todos
            -- los servicios eran públicos, así que un RLS roto habría dado
            -- el mismo conteo. Ahora hay 16 activos que anon NO debe ver.
            select count(*) into n from public.services where not is_public;
            if n <> 0 then raise exception 'anon ve % servicios sin publicar', n; end if;

            select count(*) into n from public.services where kind = 'tratamiento';
            if n <> 6 then raise exception 'anon tratamientos publicos expected 6, got %', n; end if;

            select count(*) into n from public.extras;
            if n <> 13 then raise exception 'anon extras expected 13, got %', n; end if;

            select count(*) into n from public.business_hours;
            if n <> 4 then raise exception 'anon business_hours expected 4, got %', n; end if;
          end
          $$;

          rollback;
          SQL

          # Quién trabaja acá y qué puede tocar cada rol no lo lee nadie sin
          # sesión. `roles` y `role_permissions` se suman desde que los
          # permisos por módulo viven en la base: son el mapa de quién llega
          # a la plata, y ahora la clave publicable llega al navegador.
          for TABLA in staff_members roles role_permissions; do
            PRIV=$(psql "$SUPABASE_LOCAL_DB_URL" -Atc \
              "select has_table_privilege('anon','public.$TABLA','SELECT')")
            if [ "$PRIV" != "f" ]; then
              echo "::error::anon unexpectedly has SELECT on $TABLA"
              exit 1
            fi
          done

          if psql "$SUPABASE_LOCAL_DB_URL" -v ON_ERROR_STOP=1 >/tmp/anon-write.log 2>&1 <<'SQL'
          set role anon;
          insert into public.categories(slug, name) values ('ci-anon-write-must-fail', 'CI invalid');
          SQL
          then
            echo "::error::anon write unexpectedly succeeded"
            cat /tmp/anon-write.log
            exit 1
          else
            echo "anon write correctly rejected"
          fi

      - name: Verify relational RLS hides children of hidden categories
        run: |
          set -euo pipefail

          psql "$SUPABASE_LOCAL_DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          begin;
          update public.categories set is_public = false where slug = 'peluqueria';
          set local role anon;

          do $$
          declare
            n integer;
          begin
            select count(*) into n from public.services;
            if n <> 15 then
              raise exception 'expected 15 visible services after hiding peluqueria, got %', n;
            end if;
          end
          $$;

          rollback;
          SQL

      - name: Verify booking domain invariants
        run: |
          set -euo pipefail

          psql "$SUPABASE_LOCAL_DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          declare n int;
          begin
            -- Baseline operativo sembrado
            select count(*) into n from public.areas;
            if n <> 4 then raise exception 'areas expected 4, got %', n; end if;
            -- 10 desde que se agregó monotributo_annual_cap (facturación).
            -- La fila nace SIN valor a propósito: el tope lo carga el
            -- contador de Sol, y hay una invariante aparte que falla si
            -- alguien le pone un número desde el repositorio.
            select count(*) into n from public.business_settings;
            if n <> 10 then raise exception 'business_settings expected 10, got %', n; end if;
            -- 59 = 43 + los 16 tratamientos que el salón cobra y el
            -- sistema no tenía (karseell, riflessi, ampolla, biotina…).
            select count(*) into n from public.service_parameters;
            if n <> 59 then raise exception 'service_parameters expected 59, got %', n; end if;
            -- 191 = 127 + 64 filas de precio nuevas. Las otras 20 de la
            -- lista de Sol pisaron filas que ya existían.
            select count(*) into n from public.service_price_tiers;
            if n <> 191 then raise exception 'service_price_tiers expected 191, got %', n; end if;

            -- La lista de Sol entró como sol_pricelist, NUNCA como
            -- sol_validated: son sus precios, pero ella todavía no los
            -- confirmó, y /admin/pending-values filtra por eso.
            select count(*) into n from public.service_price_tiers
             where source = 'sol_pricelist' and confidence = 'medium';
            if n <> 84 then raise exception 'tiers de la lista de Sol expected 84, got %', n; end if;

            -- price_addon es la oferta por llevarse color y tratamiento
            -- juntos. Sólo la tienen tratamientos: un corte vale lo mismo
            -- vaya solo o acompañado.
            select count(*) into n from public.service_price_tiers t
            join public.services s on s.id = t.service_id
            where t.price_addon is not null and s.kind <> 'tratamiento';
            if n <> 0 then raise exception '% servicios no-tratamiento tienen price_addon', n; end if;

            -- Gate A1: el largo nunca es modificador
            select count(*) into n
            from public.service_personalization_option_modifiers m
            join public.personalization_fields f on f.id = m.field_id
            where f.field_role = 'tier_selector';
            if n <> 0 then raise exception 'tier_selector fields carry % modifiers', n; end if;

            -- length_affects_price=false → precio constante entre tiers
            select count(*) into n from (
              select t.service_id from public.service_price_tiers t
              join public.service_parameters p on p.service_id = t.service_id
              where p.length_affects_price = false
              group by t.service_id having count(distinct t.price_main) > 1
            ) x;
            if n <> 0 then raise exception '% services violate flat-price flag', n; end if;

            -- Depilación quedó con datos validados por Sol
            select count(*) into n from public.service_price_tiers t
            join public.services s on s.id = t.service_id
            join public.categories c on c.id = s.category_id
            where c.slug = 'depilacion' and t.source <> 'sol_validated';
            if n <> 0 then raise exception 'depilacion tiers not sol_validated'; end if;
          end $$;
          SQL

          # Dominio de reservas: concurrencia, pagos y cancelación.
          psql "$SUPABASE_LOCAL_DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          declare v_tok text; v_id uuid; v_r text; v_res jsonb; i int;
          begin
            -- capacidad 1: el solape se rechaza
            perform public.create_booking('depilacion', now() + interval '3 days',
              now() + interval '3 days' + interval '30 minutes', 30, 'fixed', 30000, null, 20, 6000,
              '{"first_name":"CI","phone_e164":"+5493420001001"}'::jsonb, '[]'::jsonb, null, 'online');
            begin
              perform public.create_booking('depilacion', now() + interval '3 days' + interval '15 minutes',
                now() + interval '3 days' + interval '45 minutes', 30, 'fixed', 12000, null, 20, 2400,
                '{"first_name":"CI2","phone_e164":"+5493420001002"}'::jsonb, '[]'::jsonb, null, 'online');
              raise exception 'capacity 1 overlap was not rejected';
            exception when others then
              if sqlerrm <> 'capacity_full' then raise; end if;
            end;

            -- capacidad 5: pico real, no conteo de solapes
            for i in 1..5 loop
              perform public.create_booking('peluqueria', now() + interval '6 days' + interval '10 hours',
                now() + interval '6 days' + interval '12 hours', 120, 'fixed', 40000, null, 20, 8000,
                format('{"first_name":"P%s","phone_e164":"+549342000200%s"}', i, i)::jsonb,
                '[]'::jsonb, null, 'manual');
            end loop;
            begin
              perform public.create_booking('peluqueria', now() + interval '6 days' + interval '10 hours',
                now() + interval '6 days' + interval '12 hours', 120, 'fixed', 40000, null, 20, 8000,
                '{"first_name":"P6","phone_e164":"+5493420002099"}'::jsonb, '[]'::jsonb, null, 'manual');
              raise exception 'capacity 5 was not enforced';
            exception when others then
              if sqlerrm <> 'capacity_full' then raise; end if;
            end;

            -- servicio inexistente en items
            begin
              perform public.create_booking('depilacion', now() + interval '40 days',
                now() + interval '40 days' + interval '30 minutes', 30, 'fixed', 1, null, 20, 1,
                '{"first_name":"CI","phone_e164":"+5493420003001"}'::jsonb,
                '[{"service_slug":"no-existe","role":"main","name":"x","price_amount":1,"duration_min":1}]'::jsonb,
                null, 'online');
              raise exception 'unknown service was accepted';
            exception when others then
              if sqlerrm <> 'unknown_service' then raise; end if;
            end;

            -- pago: confirma, es idempotente, y el tardío no re-bloquea
            select b.id into v_id from public.bookings b where b.status = 'pending_payment' limit 1;
            v_r := public.confirm_booking_payment(v_id, 'mercado_pago', 'CI-1', 6000, 'approved', '{}'::jsonb);
            if v_r <> 'confirmed' then raise exception 'expected confirmed, got %', v_r; end if;
            v_r := public.confirm_booking_payment(v_id, 'mercado_pago', 'CI-1', 6000, 'approved', '{}'::jsonb);
            if v_r <> 'already_confirmed' then raise exception 'expected already_confirmed, got %', v_r; end if;

            perform public.create_booking('depilacion', now() + interval '8 days',
              now() + interval '8 days' + interval '15 minutes', 15, 'fixed', 12000, null, 20, 2400,
              '{"first_name":"Late","phone_e164":"+5493420004001"}'::jsonb, '[]'::jsonb, null, 'online');
            update public.bookings set payment_required_until = now() - interval '1 minute'
              where status = 'pending_payment';
            if public.expire_stale_bookings() < 1 then raise exception 'expire_stale_bookings did nothing'; end if;
            select b.id into v_id from public.bookings b where b.status = 'expired' limit 1;
            v_r := public.confirm_booking_payment(v_id, 'mercado_pago', 'CI-2', 2400, 'approved', '{}'::jsonb);
            if v_r <> 'late_payment' then raise exception 'expected late_payment, got %', v_r; end if;
            if (select status from public.bookings where id = v_id) <> 'expired' then
              raise exception 'late payment re-blocked the slot';
            end if;

            -- Cancelación. Sólo se devuelve dinero REALMENTE cobrado: el
            -- fixture arma cada caso en vez de tomar la primera reserva
            -- confirmada que aparezca. Un `limit 1` sin orden caía sobre
            -- una reserva interna (confirmada pero sin seña paga) y
            -- convertía esta prueba en una lotería.

            -- A) online + seña ACREDITADA + más de 24 h → se devuelve.
            select public.create_booking('depilacion', now() + interval '30 days',
              now() + interval '30 days 30 minutes', 30, 'fixed', 30000, null, 20, 6000,
              '{"first_name":"Refund","phone_e164":"+5493420005101"}'::jsonb, '[]'::jsonb, null, 'online')
              ->> 'id' into v_id;
            v_r := public.confirm_booking_payment(v_id, 'mercado_pago', 'CI-REFUND-A', 6000, 'approved', '{}'::jsonb);
            if v_r <> 'confirmed' then raise exception 'fixture roto: la seña no confirmó (%)', v_r; end if;
            select public_token into v_tok from public.bookings where id = v_id;
            if (select deposit_status from public.bookings where id = v_id) <> 'paid' then
              raise exception 'fixture roto: deposit_status no quedó en paid';
            end if;
            v_res := public.cancel_booking(v_tok, 'ci');
            if (v_res->>'refund_due')::boolean is distinct from true then
              raise exception 'esperaba refund_due=true con seña paga y >24h, dio %', v_res;
            end if;
            if v_res->>'deposit_status' <> 'refunded' then
              raise exception 'esperaba deposit_status=refunded, dio %', v_res;
            end if;

            -- B) online + seña ACREDITADA + menos de 24 h → NO se devuelve.
            --    Aísla la regla de las 24 h: acá sí había dinero cobrado.
            select public.create_booking('depilacion', now() + interval '5 hours',
              now() + interval '5 hours 30 minutes', 30, 'fixed', 30000, null, 20, 6000,
              '{"first_name":"Late","phone_e164":"+5493420005102"}'::jsonb, '[]'::jsonb, null, 'online')
              ->> 'id' into v_id;
            v_r := public.confirm_booking_payment(v_id, 'mercado_pago', 'CI-REFUND-B', 6000, 'approved', '{}'::jsonb);
            if v_r <> 'confirmed' then raise exception 'fixture roto: la seña B no confirmó (%)', v_r; end if;
            select public_token into v_tok from public.bookings where id = v_id;
            v_res := public.cancel_booking(v_tok, null);
            if (v_res->>'refund_due')::boolean is distinct from false then
              raise exception 'esperaba refund_due=false dentro de las 24 h, dio %', v_res;
            end if;
            if v_res->>'deposit_status' <> 'retained' then
              raise exception 'esperaba deposit_status=retained, dio %', v_res;
            end if;

            -- C) interna, nunca pagada → NO se devuelve, aunque falten días.
            --    Devolver acá sería prometer plata que nunca entró.
            select public.create_booking('depilacion', now() + interval '31 days',
              now() + interval '31 days 30 minutes', 30, 'fixed', 30000, null, 20, 6000,
              '{"first_name":"Soon","phone_e164":"+5493420005001"}'::jsonb, '[]'::jsonb, null, 'manual')
              ->> 'public_token' into v_tok;
            v_res := public.cancel_booking(v_tok, null);
            if (v_res->>'refund_due')::boolean is distinct from false then
              raise exception 'una reserva interna sin seña no puede generar reembolso, dio %', v_res;
            end if;
            if v_res->>'previous_status' <> 'confirmed' then
              raise exception 'previous_status missing from cancel result';
            end if;

            -- snapshot inmutable frente a cambios de catálogo
            declare v_snap int; v_bid uuid;
            begin
              select bi.booking_id, bi.snapshot_price_amount into v_bid, v_snap
                from public.booking_items bi where bi.role = 'main' limit 1;
              if v_bid is not null then
                update public.service_price_tiers set price_main = price_main + 5000
                  where service_id = (select service_id from public.booking_items
                                       where booking_id = v_bid and role = 'main');
                if (select snapshot_price_amount from public.booking_items
                     where booking_id = v_bid and role = 'main') <> v_snap then
                  raise exception 'snapshot changed after a price update';
                end if;
                if (select count(*) from public.parameter_history
                     where table_name = 'service_price_tiers' and field = 'price_main') < 1 then
                  raise exception 'parameter_history did not record the price change';
                end if;
              end if;
            end;
          end $$;

          -- Corregir una ausencia que marcó el sistema, y no una persona.
          --
          -- La marca automática puede equivocarse de una sola manera: la
          -- clienta vino y nadie tocó "Llegó". Sin corrección, esa clienta
          -- queda anotada como ausente y sin su seña.
          do $$
          declare v_id uuid; v_staff uuid; v_r jsonb; v_st text; v_dep text; v_ids uuid[];
          begin
            -- Actor de prueba, creado y borrado acá mismo, como el resto de
            -- los bloques. Dejarlo vivo rompe el arranque del panel:
            -- `bootstrap_first_staff` sólo crea a la primera persona cuando
            -- todavía no hay ninguna activa, así que un staff sobrante hace
            -- que el email de CI nunca reciba su fila y el token dé 403.
            insert into public.staff_members (slug, display_name, email, role, is_active)
            values ('ci-reversa', 'CI', 'ci-reversa@solmai.test', 'mostrador', true)
            returning id into v_staff;

            select public.create_booking('depilacion', now() - interval '2 days',
              now() - interval '2 days' + interval '30 minutes', 30, 'fixed', 30000, null, 20, 6000,
              '{"first_name":"Vino","phone_e164":"+5493420007001"}'::jsonb, '[]'::jsonb, null, 'online')
              ->> 'id' into v_id;
            perform public.confirm_booking_payment(v_id, 'mercado_pago', 'CI-REV-1', 6000, 'approved', '{}'::jsonb);
            perform public.mark_no_show(v_id, null, 'sistema');

            v_r := public.revert_auto_no_show(v_id, v_staff, 'ci@sol-mai.test');
            select status, deposit_status into v_st, v_dep from public.bookings where id = v_id;
            if v_st <> 'attended' or v_dep <> 'paid' then
              raise exception 'la corrección dejó el turno en % / %', v_st, v_dep;
            end if;

            -- Dos clics no son dos correcciones.
            if (public.revert_auto_no_show(v_id, v_staff, 'ci@sol-mai.test'))->>'status'
                 <> 'already_attended' then
              raise exception 'revert_auto_no_show no es idempotente';
            end if;

            if not exists (select 1 from public.audit_log
                            where entity_id = v_id and action = 'auto_no_show_reverted') then
              raise exception 'la corrección no quedó auditada';
            end if;

            -- Una ausencia que decidió una persona NO se deshace desde acá.
            select public.create_booking('depilacion', now() - interval '3 days',
              now() - interval '3 days' + interval '30 minutes', 30, 'fixed', 30000, null, 20, 6000,
              '{"first_name":"NoVino","phone_e164":"+5493420007002"}'::jsonb, '[]'::jsonb, null, 'online')
              ->> 'id' into v_id;
            perform public.confirm_booking_payment(v_id, 'mercado_pago', 'CI-REV-2', 6000, 'approved', '{}'::jsonb);
            perform public.mark_no_show(v_id, v_staff, 'ci@sol-mai.test');
            begin
              perform public.revert_auto_no_show(v_id, v_staff, 'ci@sol-mai.test');
              raise exception 'se revirtió una ausencia marcada por una persona';
            exception when others then
              if sqlerrm <> 'no_show_manual' then raise; end if;
            end;

            -- La devolución es la seña completa: un monto distinto se rechaza.
            select public.create_booking('depilacion', now() + interval '9 days',
              now() + interval '9 days' + interval '30 minutes', 30, 'fixed', 30000, null, 20, 6000,
              '{"first_name":"Devol","phone_e164":"+5493420007003"}'::jsonb, '[]'::jsonb, null, 'online')
              ->> 'id' into v_id;
            perform public.confirm_booking_payment(v_id, 'mercado_pago', 'CI-REV-3', 6000, 'approved', '{}'::jsonb);
            perform public.cancel_booking((select public_token from public.bookings where id = v_id), null);
            begin
              perform public.mark_refund_completed(v_id, v_staff, 'ci@sol-mai.test', 1, null);
              raise exception 'aceptó devolver 1 sobre una seña de 6000';
            exception when others then
              if sqlerrm <> 'refund_amount_mismatch' then raise; end if;
            end;

            if (public.mark_refund_completed(v_id, v_staff, 'ci@sol-mai.test', null, null))->>'amount'
                 <> '6000' then
              raise exception 'sin monto, la devolución no usó la seña completa';
            end if;

            -- Limpieza: el actor de prueba no puede sobrevivir al bloque.
            select array_agg(id) into v_ids from public.bookings
              where customer_id in (select id from public.customers
                                     where phone_e164 in ('+5493420007001','+5493420007002','+5493420007003'));
            delete from public.audit_log where entity_id = any(v_ids);
            delete from public.payments  where booking_id = any(v_ids);
            delete from public.booking_items where booking_id = any(v_ids);
            delete from public.bookings  where id = any(v_ids);
            delete from public.customers where phone_e164 in
              ('+5493420007001','+5493420007002','+5493420007003');
            delete from public.staff_members where id = v_staff;
          end $$;

          -- La caja del día: sale de `payments`, sin tablas nuevas.
          do $$
          declare
            v_id uuid; v_staff uuid; v_caja jsonb; v_ids uuid[]; v_svc text; v_items jsonb;
            v_antes jsonb; v_movs_antes int; v_efectivo_antes bigint;
          begin
            insert into public.staff_members (slug, display_name, email, role, is_active)
            values ('ci-caja', 'CI', 'ci-caja@solmai.test', 'mostrador', true)
            returning id into v_staff;

            -- Foto de la caja ANTES. Los bloques anteriores dejan plata del
            -- mismo día, así que se mide lo que agregan estos tres
            -- movimientos y no el total, que depende de qué más corrió.
            v_antes := public.cash_register(current_date);
            v_movs_antes := jsonb_array_length(v_antes->'movimientos');
            select coalesce(sum((m->>'monto')::bigint), 0) into v_efectivo_antes
              from jsonb_array_elements(v_antes->'por_medio') m where m->>'medio' = 'efectivo';

            -- Seña por Mercado Pago de un turno futuro: entra HOY. Es el
            -- caso que se pierde si la caja se agrupa por el día del turno.
            select public.create_booking('depilacion', now() + interval '6 days',
              now() + interval '6 days' + interval '30 minutes', 30, 'fixed', 30000, null, 20, 6000,
              '{"first_name":"CajaSena","phone_e164":"+5493420008001"}'::jsonb, '[]'::jsonb, null, 'online')
              ->> 'id' into v_id;
            perform public.confirm_booking_payment(v_id, 'mercado_pago', 'CI-CAJA-1', 6000, 'approved', '{}'::jsonb);

            -- Atención cobrada en efectivo.
            select s.slug into v_svc from public.services s
              join public.categories c on c.id = s.category_id
             where c.slug = 'peluqueria' and s.is_active order by s.slug limit 1;
            v_items := jsonb_build_array(jsonb_build_object('role','main','service_slug',v_svc,
              'name','Corte','price_amount',24000,'duration_min',60,'process_min',0,'setup_min',0));
            select public.create_booking('peluqueria', now() - interval '2 hours',
              now() - interval '1 hour', 60, 'fixed', 24000, null, 0, 0,
              '{"first_name":"CajaEfectivo","phone_e164":"+5493420008002"}'::jsonb, v_items, null, 'walk_in')
              ->> 'id' into v_id;
            perform public.close_service(
              p_booking_id => v_id, p_final_price => 24000, p_services_done => 'Corte',
              p_staff_id => v_staff, p_duration_min => 60,
              p_payments => jsonb_build_array(jsonb_build_object('amount',24000,'method','efectivo','kind','balance')),
              p_actor_id => v_staff, p_actor_label => 'ci-caja@solmai.test');

            -- Una seña cobrada y devuelta el mismo día: sale.
            select public.create_booking('depilacion', now() + interval '10 days',
              now() + interval '10 days' + interval '30 minutes', 30, 'fixed', 30000, null, 20, 6000,
              '{"first_name":"CajaDevuelta","phone_e164":"+5493420008003"}'::jsonb, '[]'::jsonb, null, 'online')
              ->> 'id' into v_id;
            perform public.confirm_booking_payment(v_id, 'mercado_pago', 'CI-CAJA-2', 6000, 'approved', '{}'::jsonb);
            perform public.cancel_booking((select public_token from public.bookings where id = v_id), null);
            perform public.mark_refund_completed(v_id, v_staff, 'ci-caja@solmai.test', null, null);

            v_caja := public.cash_register(current_date);
            if (v_caja->>'entro')::bigint - (v_antes->>'entro')::bigint <> 36000 then
              raise exception 'la caja sumó % y esperaba 36000',
                (v_caja->>'entro')::bigint - (v_antes->>'entro')::bigint;
            end if;
            if (v_caja->>'devuelto')::bigint - (v_antes->>'devuelto')::bigint <> 6000 then
              raise exception 'la caja restó % y esperaba 6000',
                (v_caja->>'devuelto')::bigint - (v_antes->>'devuelto')::bigint;
            end if;
            if (v_caja->>'queda')::bigint - (v_antes->>'queda')::bigint <> 30000 then
              raise exception 'a la caja le quedaron % de más y esperaba 30000',
                (v_caja->>'queda')::bigint - (v_antes->>'queda')::bigint;
            end if;
            -- El detalle tiene que existir: un número que no se puede abrir
            -- no se puede verificar.
            if jsonb_array_length(v_caja->'movimientos') - v_movs_antes <> 4 then
              raise exception 'la caja agregó % movimientos y esperaba 4',
                jsonb_array_length(v_caja->'movimientos') - v_movs_antes;
            end if;
            if (select coalesce(sum((m->>'monto')::bigint), 0)
                  from jsonb_array_elements(v_caja->'por_medio') m
                 where m->>'medio' = 'efectivo') - v_efectivo_antes <> 24000 then
              raise exception 'la caja no separó los 24000 en efectivo: %', v_caja->'por_medio';
            end if;

            select array_agg(id) into v_ids from public.bookings
              where customer_id in (select id from public.customers
                                     where phone_e164 in ('+5493420008001','+5493420008002','+5493420008003'));
            delete from public.service_execution_records where booking_id = any(v_ids);
            delete from public.audit_log where entity_id = any(v_ids);
            delete from public.payments  where booking_id = any(v_ids);
            delete from public.booking_items where booking_id = any(v_ids);
            delete from public.bookings  where id = any(v_ids);
            delete from public.customers where phone_e164 in
              ('+5493420008001','+5493420008002','+5493420008003');
            delete from public.staff_members where id = v_staff;
          end $$;
          SQL

          # anon no puede leer el dominio de reservas ni ejecutar las RPCs
          for probe in "select count(*) from public.bookings" \
                       "select count(*) from public.customers" \
                       "select public.expire_stale_bookings()"; do
            if psql "$SUPABASE_LOCAL_DB_URL" -v ON_ERROR_STOP=1 \
                 -c "set role anon; $probe;" >/tmp/anon-probe.log 2>&1; then
              echo "::error::anon unexpectedly allowed: $probe"
              cat /tmp/anon-probe.log
              exit 1
            fi
          done
          echo "booking domain invariants OK"

      - name: Verify V4.1 channels, no-show and overrides
        run: |
          set -euo pipefail

          psql "$SUPABASE_LOCAL_DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          declare v jsonb; v_id uuid; v_id2 uuid; v_n int; i int;
          begin
            -- Los cuatro canales internos confirman SIN seña. Antes la
            -- condición era `p_source = 'manual'` y los otros tres habrían
            -- caído en pending_payment.
            for i in 1..4 loop
              v := public.create_booking('peluqueria',
                now() + interval '3 days' + (i || ' hours')::interval,
                now() + interval '3 days' + (i || ' hours')::interval + interval '1 hour',
                60, 'fixed', 40000, null, 20, 8000,
                format('{"first_name":"C%s","phone_e164":"+54934259000%s"}', i, i)::jsonb,
                '[]'::jsonb, null,
                (array['manual','phone','whatsapp','walk_in'])[i], null, null, false, null);
              if v->>'status' <> 'confirmed' or v->>'deposit_status' <> 'none' then
                raise exception 'canal % exigió pago: % / %',
                  (array['manual','phone','whatsapp','walk_in'])[i], v->>'status', v->>'deposit_status';
              end if;
            end loop;

            -- El canal público sí retiene contra pago.
            v := public.create_booking('peluqueria', now() + interval '3 days 9 hours',
              now() + interval '3 days 10 hours', 60, 'fixed', 40000, null, 20, 8000,
              '{"first_name":"On","phone_e164":"+5493425900099"}'::jsonb, '[]'::jsonb, null, 'online');
            if v->>'status' <> 'pending_payment' then
              raise exception 'el canal online no exigió seña';
            end if;

            -- Override: sin él bloquea, con él entra y deja bitácora.
            perform public.create_booking('depilacion', now() + interval '4 days',
              now() + interval '4 days' + interval '30 minutes', 30, 'fixed', 12000, null, 20, 2400,
              '{"first_name":"A","phone_e164":"+5493425910001"}'::jsonb, '[]'::jsonb, null, 'manual');
            begin
              perform public.create_booking('depilacion', now() + interval '4 days',
                now() + interval '4 days' + interval '30 minutes', 30, 'fixed', 12000, null, 20, 2400,
                '{"first_name":"B","phone_e164":"+5493425910002"}'::jsonb, '[]'::jsonb, null, 'manual');
              raise exception 'sin override no debería entrar';
            exception when others then
              if sqlerrm <> 'capacity_full' then raise; end if;
            end;

            v := public.create_booking('depilacion', now() + interval '4 days',
              now() + interval '4 days' + interval '30 minutes', 30, 'fixed', 12000, null, 20, 2400,
              '{"first_name":"B","phone_e164":"+5493425910002"}'::jsonb, '[]'::jsonb, null,
              'manual', null, 'ci@sol-mai.test', true, 'excepción de prueba');
            if (v->>'created_via_override')::boolean is not true then
              raise exception 'el override no quedó marcado';
            end if;
            select count(*) into v_n from public.audit_log
             where action = 'capacity_override' and entity_id = (v->>'id')::uuid;
            if v_n <> 1 then raise exception 'el override no dejó bitácora'; end if;

            -- El override NO toca la configuración global.
            select capacity into v_n from public.areas where slug = 'depilacion';
            if v_n <> 1 then raise exception 'el override cambió la capacidad del área'; end if;

            -- El canal público no puede pedir override.
            begin
              perform public.create_booking('depilacion', now() + interval '4 days',
                now() + interval '4 days' + interval '30 minutes', 30, 'fixed', 12000, null, 20, 2400,
                '{"first_name":"X","phone_e164":"+5493425910003"}'::jsonb, '[]'::jsonb, null,
                'online', null, null, true, 'colarse');
              raise exception 'online consiguió un override';
            exception when others then
              if sqlerrm <> 'override_not_allowed_online' then raise; end if;
            end;

            -- No-show con seña acreditada: se retiene.
            v := public.create_booking('peluqueria', now() + interval '5 days',
              now() + interval '5 days 1 hour', 60, 'fixed', 40000, null, 20, 8000,
              '{"first_name":"NS","phone_e164":"+5493425920001"}'::jsonb, '[]'::jsonb, null, 'online');
            v_id := (v->>'id')::uuid;
            perform public.confirm_booking_payment(v_id, 'mercado_pago', 'CI-NS', 8000, 'approved', '{}'::jsonb);
            v := public.mark_no_show(v_id, null, 'ci@sol-mai.test');
            if v->>'deposit_status' <> 'retained' then
              raise exception 'la seña no se retuvo: %', v->>'deposit_status';
            end if;
            if (v->>'deposit_amount')::int <> 8000 then
              raise exception 'importe retenido incorrecto';
            end if;

            -- No-show sin seña: sin consecuencia económica inventada.
            v := public.create_booking('peluqueria', now() + interval '6 days',
              now() + interval '6 days 1 hour', 60, 'fixed', 40000, null, 20, 8000,
              '{"first_name":"NS2","phone_e164":"+5493425920002"}'::jsonb, '[]'::jsonb, null, 'phone');
            v_id2 := (v->>'id')::uuid;
            v := public.mark_no_show(v_id2, null, 'ci@sol-mai.test');
            if v->>'deposit_status' = 'retained' or (v->>'deposit_amount')::int <> 0 then
              raise exception 'retuvo una seña inexistente';
            end if;

            -- no_show y cancelled no se mezclan. Se mide sobre LAS DOS
            -- reservas que este bloque marcó, no sobre toda la tabla: un
            -- conteo global depende de lo que hicieron los pasos previos
            -- y sólo daba cero mientras el paso anterior venía fallando.
            select count(*) into v_n from public.bookings
             where id in (v_id, v_id2) and status = 'no_show';
            if v_n <> 2 then raise exception 'esperaba 2 ausencias, hay %', v_n; end if;
            select count(*) into v_n from public.bookings
             where id in (v_id, v_id2) and status = 'cancelled';
            if v_n <> 0 then raise exception 'un no_show se contó como cancelled'; end if;

            -- Las cuatro áreas quedan reservables online (D-13).
            select count(*) into v_n from public.areas where is_bookable_online;
            if v_n <> 4 then raise exception 'esperaba 4 áreas online, hay %', v_n; end if;
          end $$;
          SQL

          echo "V4.1 channel/no-show/override invariants OK"

      - name: Verify V4.1 resources
        run: |
          set -euo pipefail

          psql "$SUPABASE_LOCAL_DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          declare
            v_area uuid; v_n int; v_cap int; v_res uuid; v_staff uuid;
            v jsonb; v_day date; v_svc text; v_items jsonb; v_b1 uuid; v_b2 uuid; v_b3 uuid;
          begin
            select id into v_area from public.areas where slug = 'peluqueria';

            -- ÁREA != ESTACIÓN: la capacidad se deriva de las estaciones.
            select count(*) into v_n from public.resources
             where kind = 'physical' and is_active;
            if v_n <> 8 then raise exception 'esperaba 8 estaciones, hay %', v_n; end if;

            select capacity into v_cap from public.areas where id = v_area;
            if v_cap <> 5 then raise exception 'Peluquería debería tener capacidad 5, tiene %', v_cap; end if;

            -- Agregar una estación sube la capacidad sin tocar el área a mano.
            insert into public.resources (area_id, kind, code, name)
            values (v_area, 'physical', 'P6', 'Estación 6') returning id into v_res;
            select capacity into v_cap from public.areas where id = v_area;
            if v_cap <> 6 then raise exception 'agregar una estación no subió la capacidad: %', v_cap; end if;

            update public.resources set is_active = false where id = v_res;
            select capacity into v_cap from public.areas where id = v_area;
            if v_cap <> 5 then raise exception 'desactivar una estación no bajó la capacidad: %', v_cap; end if;

            -- Fuera de servicio: baja la capacidad EFECTIVA sólo en su rango.
            select id into v_res from public.resources
             where area_id = v_area and code = 'P1';
            insert into public.resource_blocks (resource_id, starts_at, ends_at, reason)
            values (v_res, now() + interval '10 days', now() + interval '11 days', 'Reparación');

            v_cap := public.effective_area_capacity(v_area,
                       now() + interval '10 days' + interval '2 hours',
                       now() + interval '10 days' + interval '3 hours');
            if v_cap <> 4 then raise exception 'una estación fuera de servicio debería dejar 4, dejó %', v_cap; end if;

            v_cap := public.effective_area_capacity(v_area,
                       now() + interval '20 days', now() + interval '20 days' + interval '1 hour');
            if v_cap <> 5 then raise exception 'fuera del rango la capacidad debe volver a 5, dio %', v_cap; end if;

            -- Un recurso humano sin persona no significa nada.
            begin
              insert into public.resources (area_id, kind, code, name)
              values (v_area, 'human', 'X1', 'Sin persona');
              raise exception 'gate roto: se aceptó un recurso humano sin staff';
            exception when check_violation then null;
            end;

            -- El paso tiene que poder repetirse: no dejar rastros.
            delete from public.resource_blocks where resource_id = v_res;
            delete from public.resources where area_id = v_area and code = 'P6';
          end $$;
          SQL

          echo "V4.1 resource invariants OK"

      - name: Verify out-of-service stations reduce enforced capacity
        run: |
          set -euo pipefail

          psql "$SUPABASE_LOCAL_DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          declare
            v_day date := (current_date + 30);
            v_svc text; v_items jsonb; v_res uuid; v_area uuid; r jsonb; i int; v_id uuid;
            v_from timestamptz; v_to timestamptz;
          begin
            select id into v_area from public.areas where slug = 'peluqueria';
            v_from := (v_day::text || ' 10:00-03')::timestamptz;
            v_to   := (v_day::text || ' 11:00-03')::timestamptz;

            select s.slug into v_svc from public.services s
             where s.is_active and not exists (
               select 1 from public.service_personalization_rules r2
                 join public.personalization_fields f on f.id = r2.field_id
                where r2.service_id = s.id and f.field_role = 'tier_selector')
             order by s.slug limit 1;
            v_items := jsonb_build_array(jsonb_build_object('role','main','service_slug',v_svc,
              'name','Prueba','price_amount',20000,'duration_min',60,'process_min',0,'setup_min',0));

            r := public.check_capacity('peluqueria', v_from, v_to);
            if (r->>'capacity')::int <> 5 then
              raise exception 'sin bloqueos la capacidad debe ser 5, dio %', r->>'capacity';
            end if;

            -- `effective_area_capacity` existía y no la llamaba nadie: sin
            -- esto, un sillón roto no reducía la disponibilidad y el salón
            -- seguía tomando 5 turnos simultáneos con 4 puestos usables.
            select id into v_res from public.resources where area_id = v_area and code = 'P1';
            insert into public.resource_blocks (resource_id, starts_at, ends_at, reason)
            values (v_res, v_from - interval '1 hour', v_to + interval '1 hour', 'Sillón roto');

            r := public.check_capacity('peluqueria', v_from, v_to);
            if (r->>'capacity')::int <> 4 then
              raise exception 'una estación fuera de servicio debe dejar capacidad 4, dio %',
                r->>'capacity';
            end if;

            for i in 1..4 loop
              perform public.create_booking('peluqueria', v_from, v_to, 60,
                'fixed', 20000, 20000, 0.30, 6000,
                format('{"first_name":"K%s","phone_e164":"+54934259100%s"}', i, i)::jsonb,
                v_items, null, 'manual');
            end loop;

            -- El quinto NO entra: no hay sillón libre.
            begin
              perform public.create_booking('peluqueria', v_from, v_to, 60,
                'fixed', 20000, 20000, 0.30, 6000,
                '{"first_name":"K5","phone_e164":"+5493425910099"}'::jsonb,
                v_items, null, 'manual');
              raise exception 'GATE ROTO: entró un quinto turno con sólo cuatro puestos usables';
            exception when raise_exception then
              if position('GATE ROTO' in sqlerrm) > 0 then raise; end if;
            end;

            -- La excepción explícita sigue siendo posible, y queda registrada.
            v_id := (public.create_booking('peluqueria', v_from, v_to, 60,
              'fixed', 20000, 20000, 0.30, 6000,
              '{"first_name":"K6","phone_e164":"+5493425910088"}'::jsonb,
              v_items, null, 'manual', null, 'ci', true, 'La clienta ya está en el salón')->>'id')::uuid;
            if not (select created_via_override from public.bookings where id = v_id) then
              raise exception 'el override debería quedar registrado';
            end if;

            -- Reparada la estación, la capacidad vuelve sola.
            delete from public.resource_blocks where resource_id = v_res;
            r := public.check_capacity('peluqueria', v_from, v_to);
            if (r->>'capacity')::int <> 5 then
              raise exception 'al reparar la estación la capacidad debe volver a 5, dio %',
                r->>'capacity';
            end if;

            delete from public.payments where booking_id in
              (select id from public.bookings where starts_at = v_from);
            delete from public.bookings where starts_at = v_from;
          end $$;
          SQL

          echo "effective-capacity invariants OK"

      - name: Verify V4.1 dashboard
        run: |
          set -euo pipefail

          psql "$SUPABASE_LOCAL_DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          declare
            v_day date; v_svc text; v_items jsonb;
            v_b1 uuid; v_b2 uuid; v_b3 uuid; r jsonb;
            v_from timestamptz; v_to timestamptz;
          begin
            -- Un MARTES futuro y limpio, en hora del SALÓN.
            --
            -- Lejos de todo: a +14 días la ventana pisaba el fixture de
            -- "invariantes" (`now() + 8 días`, con una seña de 2400
            -- acreditada) cada vez que CI corría un domingo, y entonces
            -- `collected_amount` daba 42400 en vez de 40000. El número
            -- dependía del día de la semana en que se ejecutara la suite.
            -- Por eso se fija un día de la semana concreto, a un año
            -- vista, fuera del alcance de cualquier otro fixture.
            --
            -- Era lunes, porque el salón abría los lunes. Ya no: Sol
            -- cierra los lunes, así que ese día la capacidad es cero y
            -- la prueba de ocupación medía la nada. `date_trunc('week')`
            -- da lunes; +1 día da martes, que el salón sí atiende.
            v_day  := (date_trunc('week', current_date) + interval '56 weeks' + interval '1 day')::date;
            v_from := (v_day::text     || ' 00:00:00-03')::timestamptz;
            v_to   := ((v_day+1)::text || ' 00:00:00-03')::timestamptz;

            -- Y si algún día vuelve a pisarse, que falle diciendo eso en
            -- vez de devolver un total equivocado.
            if exists (select 1 from public.bookings
                        where starts_at >= v_from and starts_at < v_to) then
              raise exception 'ventana contaminada: ya hay % reserva(s) ajena(s) el %',
                (select count(*) from public.bookings
                  where starts_at >= v_from and starts_at < v_to), v_day;
            end if;

            select s.slug into v_svc from public.services s
             where s.is_active and not exists (
               select 1 from public.service_personalization_rules r2
                 join public.personalization_fields f on f.id = r2.field_id
                where r2.service_id = s.id and f.field_role = 'tier_selector')
             order by s.slug limit 1;

            v_items := jsonb_build_array(jsonb_build_object(
              'role','main','service_slug',v_svc,'name','Servicio de prueba',
              'price_amount',20000,'duration_min',60,'process_min',0,'setup_min',0));

            v_b1 := (public.create_booking('peluqueria',
              (v_day::text||' 10:00-03')::timestamptz, (v_day::text||' 11:00-03')::timestamptz,
              60,'fixed',20000,20000,0.30,6000,
              '{"first_name":"Ana","phone_e164":"+5493425900101"}'::jsonb, v_items, null, 'online')->>'id')::uuid;
            v_b2 := (public.create_booking('peluqueria',
              (v_day::text||' 12:00-03')::timestamptz, (v_day::text||' 13:00-03')::timestamptz,
              60,'fixed',20000,20000,0.30,6000,
              '{"first_name":"Bru","phone_e164":"+5493425900102"}'::jsonb, v_items, null, 'walk_in')->>'id')::uuid;
            v_b3 := (public.create_booking('peluqueria',
              (v_day::text||' 14:00-03')::timestamptz, (v_day::text||' 15:00-03')::timestamptz,
              60,'fixed',20000,20000,0.30,6000,
              '{"first_name":"Car","phone_e164":"+5493425900103"}'::jsonb, v_items, null, 'whatsapp')->>'id')::uuid;

            perform public.close_service(v_b1, 22000, 'Corte y color', null, 75, null, null, null,
              jsonb_build_array(jsonb_build_object('amount',22000,'method','efectivo','kind','balance')));
            perform public.close_service(v_b2, 18000, 'Corte', null, 55, null, null, null,
              jsonb_build_array(jsonb_build_object('amount',18000,'method','mercado_pago','kind','balance')));
            update public.bookings set deposit_status = 'paid' where id = v_b3;
            perform public.mark_no_show(v_b3, null, 'ci');

            r := public.dashboard_summary(v_from, v_to);

            if (r->>'invoiced_amount')::bigint <> 40000 then
              raise exception 'facturado esperado 40000, dio %', r->>'invoiced_amount';
            end if;
            if (r->>'average_ticket')::int <> 20000 then
              raise exception 'ticket esperado 20000, dio %', r->>'average_ticket';
            end if;
            -- El efectivo cuenta igual que Mercado Pago.
            if (r->>'collected_amount')::bigint <> 40000 then
              raise exception 'cobrado esperado 40000, dio %', r->>'collected_amount';
            end if;
            if (r->>'retained_deposits')::bigint <> 6000 then
              raise exception 'seña retenida esperada 6000, dio %', r->>'retained_deposits';
            end if;

            -- LA regla del bloque: sin costos cargados el margen NO existe.
            -- available=false y amount NULL; jamás $0, que parecería un dato.
            if (r->'margin'->>'available')::boolean is not false then
              raise exception 'el margen se declaró disponible sin costos cargados';
            end if;
            if r->'margin'->>'amount' is not null then
              raise exception 'el margen devolvió un número sin costos: %', r->'margin';
            end if;

            -- Con UN costo aparece, y declara sobre cuántas atenciones.
            update public.service_execution_records set cost_amount = 7000 where booking_id = v_b1;
            r := public.dashboard_summary(v_from, v_to);
            if (r->'margin'->>'available')::boolean is not true then
              raise exception 'con un costo cargado el margen debería estar disponible';
            end if;
            if (r->'margin'->>'amount')::bigint <> 15000 then
              raise exception 'margen esperado 15000, dio %', r->'margin'->>'amount';
            end if;
            if (r->'margin'->>'coverage')::int <> 1 then
              raise exception 'cobertura esperada 1, dio %', r->'margin'->>'coverage';
            end if;

            -- Un día del SALÓN cuenta un día, no dos fechas UTC.
            if (r->'occupancy'->>'capacity_minutes')::bigint <> 3360 then
              raise exception 'un martes del salón debe dar 3360 min (8 estaciones x 7 h), dio %',
                r->'occupancy'->>'capacity_minutes';
            end if;
            -- La ausencia no suma ocupación; la atendida sí.
            if (r->'occupancy'->>'sold_minutes')::bigint <> 120 then
              raise exception 'vendidos esperados 120 min, dio %', r->'occupancy'->>'sold_minutes';
            end if;

            -- Un feriado sale del DENOMINADOR en vez de hundir la ocupación.
            insert into public.schedule_exceptions (area_id, starts_at, ends_at, reason, capacity_delta)
            values (null, v_from, v_to, 'Feriado CI', null);
            r := public.dashboard_summary(v_from, v_to);
            if (r->'occupancy'->>'capacity_minutes')::bigint <> 0 then
              raise exception 'un día cerrado no debería aportar capacidad, dio %',
                r->'occupancy'->>'capacity_minutes';
            end if;

            -- Un ajuste de cupos NO es un cierre.
            update public.schedule_exceptions set capacity_delta = -2
             where starts_at = v_from and reason = 'Feriado CI';
            r := public.dashboard_summary(v_from, v_to);
            if (r->'occupancy'->>'capacity_minutes')::bigint <> 3360 then
              raise exception 'un ajuste de cupos no debe leerse como cierre, dio %',
                r->'occupancy'->>'capacity_minutes';
            end if;

            delete from public.schedule_exceptions where reason = 'Feriado CI';
            delete from public.payments where booking_id in (v_b1, v_b2, v_b3);
            delete from public.bookings where id in (v_b1, v_b2, v_b3);
          end $$;
          SQL

          echo "V4.1 dashboard invariants OK"

      - name: Verify consent, override reason and salon-timezone lock
        run: |
          set -euo pipefail

          psql "$SUPABASE_LOCAL_DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          declare
            v_svc text; v_items jsonb; d date := current_date + 130;
            v_am boolean; v_b uuid;
          begin
            select s.slug into v_svc from public.services s
             where s.is_active and not exists (
               select 1 from public.service_personalization_rules x
                 join public.personalization_fields f on f.id = x.field_id
                where x.service_id = s.id and f.field_role = 'tier_selector')
             order by s.slug limit 1;
            v_items := jsonb_build_array(jsonb_build_object('role','main','service_slug',v_svc,
              'name','X','price_amount',10000,'duration_min',60,'process_min',0,'setup_min',0));

            -- CONSENTIMIENTO: un turno de mostrador no puede revocarlo.
            perform public.create_booking('peluqueria',
              (d::text || ' 10:00-03')::timestamptz, (d::text || ' 11:00-03')::timestamptz,
              60,'fixed',10000,10000,0.20,2000,
              '{"first_name":"Rosa","phone_e164":"+5493425550001","email":"rosa@x.ar","accepts_marketing":true}'::jsonb,
              v_items, null, 'online');
            perform public.create_booking('peluqueria',
              (d::text || ' 12:00-03')::timestamptz, (d::text || ' 13:00-03')::timestamptz,
              60,'fixed',10000,10000,0,0,
              '{"first_name":"Rosa","phone_e164":"+5493425550001"}'::jsonb,
              v_items, null, 'walk_in');
            select accepts_marketing into v_am from public.customers where phone_e164 = '+5493425550001';
            if v_am is not true then
              raise exception 'un turno interno revocó el consentimiento';
            end if;

            -- Un valor EXPLÍCITO sí manda.
            perform public.create_booking('peluqueria',
              (d::text || ' 14:00-03')::timestamptz, (d::text || ' 15:00-03')::timestamptz,
              60,'fixed',10000,10000,0,0,
              '{"first_name":"Rosa","phone_e164":"+5493425550001","accepts_marketing":false}'::jsonb,
              v_items, null, 'walk_in');
            select accepts_marketing into v_am from public.customers where phone_e164 = '+5493425550001';
            if v_am is not false then
              raise exception 'no respetó un consentimiento negado explícitamente';
            end if;

            -- Y una clienta nueva sin el campo no estrena un "sí".
            perform public.create_booking('peluqueria',
              (d::text || ' 09:30-03')::timestamptz, (d::text || ' 10:00-03')::timestamptz,
              30,'fixed',10000,10000,0,0,
              '{"first_name":"Nueva","phone_e164":"+5493425550099"}'::jsonb,
              v_items, null, 'manual');
            select accepts_marketing into v_am from public.customers where phone_e164 = '+5493425550099';
            if v_am is not false then raise exception 'inventó un consentimiento'; end if;

            -- MOTIVO DEL OVERRIDE: una excepción sin justificación no es
            -- auditable, y auditarla es la única razón por la que existe.
            perform public.create_booking('depilacion',
              (d::text || ' 10:00-03')::timestamptz, (d::text || ' 11:00-03')::timestamptz,
              60,'fixed',10000,10000,0,0,
              '{"first_name":"A","phone_e164":"+5493425556001"}'::jsonb, v_items, null, 'manual');

            begin
              perform public.create_booking('depilacion',
                (d::text || ' 10:00-03')::timestamptz, (d::text || ' 11:00-03')::timestamptz,
                60,'fixed',10000,10000,0,0,
                '{"first_name":"B","phone_e164":"+5493425556002"}'::jsonb, v_items, null, 'manual',
                null, 'ci', true, null);
              raise exception 'GATE ROTO: override sin motivo';
            exception when others then
              if position('GATE ROTO' in sqlerrm) > 0 then raise; end if;
              if sqlerrm <> 'override_reason_required' then raise; end if;
            end;

            begin
              perform public.create_booking('depilacion',
                (d::text || ' 10:00-03')::timestamptz, (d::text || ' 11:00-03')::timestamptz,
                60,'fixed',10000,10000,0,0,
                '{"first_name":"C","phone_e164":"+5493425556003"}'::jsonb, v_items, null, 'manual',
                null, 'ci', true, '   ');
              raise exception 'GATE ROTO: override con motivo en blanco';
            exception when others then
              if position('GATE ROTO' in sqlerrm) > 0 then raise; end if;
              if sqlerrm <> 'override_reason_required' then raise; end if;
            end;

            v_b := (public.create_booking('depilacion',
              (d::text || ' 10:00-03')::timestamptz, (d::text || ' 11:00-03')::timestamptz,
              60,'fixed',10000,10000,0,0,
              '{"first_name":"D","phone_e164":"+5493425556004"}'::jsonb, v_items, null, 'manual',
              null, 'ci', true, 'Cliente habitual, solicita excepción')->>'id')::uuid;
            if (select override_reason from public.bookings where id = v_b) is null then
              raise exception 'el motivo no quedó guardado';
            end if;

            delete from public.payments where booking_id in
              (select id from public.bookings where starts_at::date = d);
            delete from public.bookings where starts_at::date = d;
          end $$;
          SQL

          # LOCK POR DÍA DEL SALÓN. 20:30 y 21:30 ART se solapan, y con la
          # fecha en UTC caían en días distintos (21:00 ART es medianoche
          # UTC), tomaban locks diferentes y ambas entraban con capacidad 1.
          psql "$SUPABASE_LOCAL_DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          declare k_a text; k_b text;
          begin
            k_a := to_char((current_date + 140 || ' 20:30-03')::timestamptz
                     at time zone 'America/Argentina/Buenos_Aires', 'YYYY-MM-DD');
            k_b := to_char((current_date + 140 || ' 21:30-03')::timestamptz
                     at time zone 'America/Argentina/Buenos_Aires', 'YYYY-MM-DD');
            if k_a <> k_b then
              raise exception 'dos reservas de la misma noche tomarían locks distintos: % vs %', k_a, k_b;
            end if;
          end $$;
          SQL

          cat > /tmp/lock-a.sql <<'SQLA'
          do $$
          declare v_svc text; v_items jsonb; d date := current_date + 140;
          begin
            select s.slug into v_svc from public.services s
             where s.is_active and not exists (
               select 1 from public.service_personalization_rules x
                 join public.personalization_fields f on f.id = x.field_id
                where x.service_id = s.id and f.field_role = 'tier_selector')
             order by s.slug limit 1;
            v_items := jsonb_build_array(jsonb_build_object('role','main','service_slug',v_svc,
              'name','X','price_amount',10000,'duration_min',120,'process_min',0,'setup_min',0));
            perform public.create_booking('depilacion',
              (d::text || ' 20:30-03')::timestamptz, (d::text || ' 22:30-03')::timestamptz,
              120,'fixed',10000,10000,0,0,
              '{"first_name":"A","phone_e164":"+5493425888001"}'::jsonb, v_items, null, 'manual');
          end $$;
          SQLA
          sed 's/20:30-03/21:30-03/; s/22:30-03/23:30-03/; s/"A"/"B"/; s/888001/888002/'             /tmp/lock-a.sql > /tmp/lock-b.sql

          # En paralelo: una entra, la otra rebota.
          psql "$SUPABASE_LOCAL_DB_URL" -f /tmp/lock-a.sql > /tmp/lock-a.log 2>&1 &
          psql "$SUPABASE_LOCAL_DB_URL" -f /tmp/lock-b.sql > /tmp/lock-b.log 2>&1 &
          wait

          OVERLAPPING=$(psql "$SUPABASE_LOCAL_DB_URL" -Atc "
            select count(*) from public.bookings b
              join public.areas a on a.id = b.area_id
             where a.slug = 'depilacion'
               and b.starts_at::date >= (current_date + 140)")
          if [ "$OVERLAPPING" != "1" ]; then
            echo "::error::overbooking cruzando medianoche UTC: $OVERLAPPING reservas solapadas"
            cat /tmp/lock-a.log /tmp/lock-b.log
            exit 1
          fi

          # Una sola reserva también es lo que se ve si una de las dos
          # transacciones nunca llegó a competir. Que el rebote sea por
          # capacidad, y exactamente uno.
          REBOTES=$(cat /tmp/lock-a.log /tmp/lock-b.log | grep -c "capacity_full" || true)
          if [ "$REBOTES" != "1" ]; then
            echo "::error::se esperaba exactamente 1 rebote por capacidad y hubo $REBOTES: las dos transacciones no compitieron"
            cat /tmp/lock-a.log /tmp/lock-b.log
            exit 1
          fi

          # Y la costura de MEDIANOCHE DEL SALÓN, que es donde se había
          # mudado el defecto al cambiar la clave de UTC a hora local.
          # Cualquier clave con fecha tiene una costura: una reserva puede
          # empezar de un lado y terminar del otro. Ocho transacciones
          # simultáneas, 23:30→01:30 contra 00:30→02:30, capacidad 1.
          psql "$SUPABASE_LOCAL_DB_URL" -v ON_ERROR_STOP=1 -c \
            "delete from public.payments where booking_id in (select id from public.bookings where starts_at::date >= (current_date + 140));
             delete from public.bookings where starts_at::date >= (current_date + 140);"

          # Dos ventanas escritas a mano, no derivadas con sed: la B
          # empieza el día SIGUIENTE del salón. Con una clave de lock por
          # fecha caen en llaves distintas y no se serializan; ése es el
          # caso que hay que cubrir, y un sed mal aplicado lo convertía
          # en un solape cualquiera dentro del mismo día.
          #   A: día d   23:30 → d+1 01:30   (fecha de salón d)
          #   B: día d+1 00:30 → d+1 02:30   (fecha de salón d+1)
          cat > /tmp/seam-a.sql <<'SQLA'
          do $$
          declare v_svc text; v_items jsonb; d date := current_date + 175;
          begin
            select s.slug into v_svc from public.services s
             where s.is_active and not exists (
               select 1 from public.service_personalization_rules x
                 join public.personalization_fields f on f.id = x.field_id
                where x.service_id = s.id and f.field_role = 'tier_selector')
             order by s.slug limit 1;
            v_items := jsonb_build_array(jsonb_build_object('role','main','service_slug',v_svc,
              'name','X','price_amount',10000,'duration_min',120,'process_min',0,'setup_min',0));
            perform public.create_booking('depilacion',
              (d::text || ' 23:30-03')::timestamptz, ((d+1)::text || ' 01:30-03')::timestamptz,
              120,'fixed',10000,10000,0,0,
              format('{"first_name":"SA","phone_e164":"+54934258891%s"}', lpad(floor(random()*10000)::int::text, 4, '0'))::jsonb,
              v_items, null, 'manual');
          end $$;
          SQLA

          cat > /tmp/seam-b.sql <<'SQLB'
          do $$
          declare v_svc text; v_items jsonb; d date := current_date + 175;
          begin
            select s.slug into v_svc from public.services s
             where s.is_active and not exists (
               select 1 from public.service_personalization_rules x
                 join public.personalization_fields f on f.id = x.field_id
                where x.service_id = s.id and f.field_role = 'tier_selector')
             order by s.slug limit 1;
            v_items := jsonb_build_array(jsonb_build_object('role','main','service_slug',v_svc,
              'name','X','price_amount',10000,'duration_min',120,'process_min',0,'setup_min',0));
            perform public.create_booking('depilacion',
              ((d+1)::text || ' 00:30-03')::timestamptz, ((d+1)::text || ' 02:30-03')::timestamptz,
              120,'fixed',10000,10000,0,0,
              format('{"first_name":"SB","phone_e164":"+54934258892%s"}', lpad(floor(random()*10000)::int::text, 4, '0'))::jsonb,
              v_items, null, 'manual');
          end $$;
          SQLB

          # Las dos ventanas tienen que caer en fechas de salón distintas:
          # si no, la prueba mira otra cosa.
          psql "$SUPABASE_LOCAL_DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          declare d date := current_date + 175; k_a text; k_b text;
          begin
            k_a := to_char((d::text || ' 23:30-03')::timestamptz
                     at time zone 'America/Argentina/Buenos_Aires', 'YYYY-MM-DD');
            k_b := to_char(((d+1)::text || ' 00:30-03')::timestamptz
                     at time zone 'America/Argentina/Buenos_Aires', 'YYYY-MM-DD');
            if k_a = k_b then
              raise exception 'fixture roto: las dos ventanas caen el mismo día del salón (%)', k_a;
            end if;
          end $$;
          SQL

          rm -f /tmp/seam-out.log
          for i in 1 2 3 4; do
            psql "$SUPABASE_LOCAL_DB_URL" -f /tmp/seam-a.sql >> /tmp/seam-out.log 2>&1 &
            psql "$SUPABASE_LOCAL_DB_URL" -f /tmp/seam-b.sql >> /tmp/seam-out.log 2>&1 &
          done
          wait

          # Los ocho intentos tienen que llegar al control de capacidad. Un
          # error de fixture —un teléfono inválido, un servicio que no
          # existe— también deja una sola reserva, y entonces el paso
          # pasaría sin haber probado nunca la concurrencia.
          OTROS=$(grep -E "^(psql:)?.*ERROR" /tmp/seam-out.log | grep -vc "capacity_full" || true)
          if [ "$OTROS" != "0" ]; then
            echo "::error::el fixture del seam falló por algo que no es capacidad ($OTROS intento(s)); la prueba no habría demostrado nada"
            grep -E "ERROR" /tmp/seam-out.log | grep -v "capacity_full" | head -5
            exit 1
          fi
          RECHAZOS=$(grep -c "capacity_full" /tmp/seam-out.log || true)
          if [ "$RECHAZOS" -lt 5 ]; then
            echo "::error::sólo $RECHAZOS intento(s) llegaron a competir por la capacidad; se esperaban 7"
            exit 1
          fi

          SEAM=$(psql "$SUPABASE_LOCAL_DB_URL" -Atc "
            select count(*) from public.bookings b
              join public.areas a on a.id = b.area_id
             where a.slug = 'depilacion'
               and b.starts_at >= (current_date + 175)::timestamptz")
          if [ "$SEAM" != "1" ]; then
            echo "::error::overbooking cruzando medianoche del salón: $SEAM reservas solapadas"
            exit 1
          fi

          psql "$SUPABASE_LOCAL_DB_URL" -v ON_ERROR_STOP=1 -c             "delete from public.payments where booking_id in (select id from public.bookings where starts_at::date >= (current_date + 140));
             delete from public.bookings where starts_at::date >= (current_date + 140);"

          echo "consent / override-reason / salon-lock OK"

      - name: Verify standard costs are not public
        run: |
          set -euo pipefail

          psql "$SUPABASE_LOCAL_DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          begin
            -- El costo por servicio es la base del margen. La clave
            -- pública se publica por diseño, así que dejar la columna
            -- bajo la política de lectura pública era publicar la
            -- estructura de costos del salón.
            if has_column_privilege('anon','public.service_parameters','standard_cost_amount','SELECT') then
              raise exception 'anon puede leer el costo estándar';
            end if;
            if has_column_privilege('authenticated','public.service_parameters','standard_cost_amount','SELECT') then
              raise exception 'authenticated puede leer el costo estándar';
            end if;

            -- Un revoke de columna NO recorta un grant de tabla: si el
            -- de tabla vuelve, el costo vuelve a quedar expuesto.
            if has_table_privilege('anon','public.service_parameters','SELECT') then
              raise exception 'anon conserva SELECT de tabla: el revoke de columna no protege nada';
            end if;

            -- Y lo que el catálogo necesita tiene que seguir saliendo.
            if not has_column_privilege('anon','public.service_parameters','price_display_mode','SELECT') then
              raise exception 'se rompió la lectura pública del catálogo';
            end if;
            if not has_column_privilege('anon','public.service_parameters','length_affects_price','SELECT') then
              raise exception 'se rompió la lectura pública del catálogo';
            end if;
            if not has_column_privilege('service_role','public.service_parameters','standard_cost_amount','SELECT') then
              raise exception 'el backend perdió acceso al costo';
            end if;
          end $$;
          SQL

          echo "standard cost protection OK"

      - name: Verify service closure is idempotent
        run: |
          set -euo pipefail

          psql "$SUPABASE_LOCAL_DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          declare
            v_svc text; v_items jsonb; d date := current_date + 120;
            v_b uuid; n int; total bigint; r jsonb;
          begin
            select s.slug into v_svc from public.services s
             where s.is_active and not exists (
               select 1 from public.service_personalization_rules x
                 join public.personalization_fields f on f.id = x.field_id
                where x.service_id = s.id and f.field_role = 'tier_selector')
             order by s.slug limit 1;
            v_items := jsonb_build_array(jsonb_build_object('role','main','service_slug',v_svc,
              'name','Corte','price_amount',20000,'duration_min',60,'process_min',0,'setup_min',0));

            v_b := (public.create_booking('peluqueria',
              (d::text || ' 10:00-03')::timestamptz, (d::text || ' 11:00-03')::timestamptz,
              60,'fixed',20000,20000,0,0,
              '{"first_name":"Idem","phone_e164":"+5493425661001"}'::jsonb,
              v_items, null, 'manual')->>'id')::uuid;

            -- Cerrar dos veces cobra UNA vez. Antes, el `provider_ref`
            -- llevaba el reloj y `provider` quedaba NULL: el UNIQUE nunca
            -- mordía y $24.000 quedaban registrados como $48.000.
            perform public.close_service(v_b, 24000, 'Corte', null, 60, null, null, null,
              jsonb_build_array(jsonb_build_object('amount',24000,'method','efectivo','kind','balance')));
            r := public.close_service(v_b, 24000, 'Corte', null, 60, null, null, null,
              jsonb_build_array(jsonb_build_object('amount',24000,'method','efectivo','kind','balance')));

            select count(*), coalesce(sum(amount),0) into n, total
              from public.payments where booking_id = v_b and status = 'approved';
            if n <> 1 or total <> 24000 then
              raise exception 'doble cobro: % lineas, total %', n, total;
            end if;
            if (r->>'reclosed')::boolean is not true then
              raise exception 'el segundo cierre no se reconoció como corrección';
            end if;

            -- Un cierre con menos líneas es una corrección: las que
            -- sobran se van. Si no, un cobro mal cargado quedaría para
            -- siempre inflando el total.
            perform public.close_service(v_b, 26000, 'x', null, 70, null, null, null,
              jsonb_build_array(jsonb_build_object('amount',20000,'method','efectivo','kind','balance'),
                                jsonb_build_object('amount',6000,'method','transferencia','kind','balance')));
            select count(*), coalesce(sum(amount),0) into n, total
              from public.payments where booking_id = v_b and status = 'approved';
            if n <> 2 or total <> 26000 then
              raise exception 'esperaba 2 lineas y 26000, dio % y %', n, total;
            end if;

            perform public.close_service(v_b, 20000, 'x', null, 70, null, null, null,
              jsonb_build_array(jsonb_build_object('amount',20000,'method','efectivo','kind','balance')));
            select count(*), coalesce(sum(amount),0) into n, total
              from public.payments where booking_id = v_b and status = 'approved';
            if n <> 1 or total <> 20000 then
              raise exception 'quedaron lineas huerfanas: % lineas, total %', n, total;
            end if;

            -- Un pago externo no se toca nunca desde el cierre.
            perform public.confirm_booking_payment(v_b,'mercado_pago','mp:CI-CLOSE',5000,'approved','{}'::jsonb);
            perform public.close_service(v_b, 20000, 'x', null, 70, null, null, null,
              jsonb_build_array(jsonb_build_object('amount',20000,'method','efectivo','kind','balance')));
            select count(*) into n from public.payments
             where booking_id = v_b and provider = 'mercado_pago';
            if n <> 1 then raise exception 'el cierre borró un pago externo'; end if;

            -- El UNIQUE tiene que morder aunque el proveedor sea NULL.
            begin
              insert into public.payments (booking_id, provider, provider_ref, amount, status, method, kind)
              values (v_b, null, 'dup-null-ref', 1, 'approved', 'efectivo', 'balance');
              insert into public.payments (booking_id, provider, provider_ref, amount, status, method, kind)
              values (v_b, null, 'dup-null-ref', 1, 'approved', 'efectivo', 'balance');
              raise exception 'GATE ROTO: dos pagos iguales sin proveedor convivieron';
            exception when unique_violation then null;
            end;

            delete from public.payments where booking_id = v_b;
            delete from public.bookings where id = v_b;
          end $$;
          SQL

          echo "service closure idempotency OK"

      - name: Verify booking status changes are attributable
        run: |
          set -euo pipefail

          psql "$SUPABASE_LOCAL_DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          declare
            v_svc text; v_items jsonb; d date := current_date + 200;
            v_b uuid; v_actor uuid; v_status text; v_n int; v_detail jsonb; v_ok boolean;
          begin
            select s.slug into v_svc from public.services s
             where s.is_active and not exists (
               select 1 from public.service_personalization_rules x
                 join public.personalization_fields f on f.id = x.field_id
                where x.service_id = s.id and f.field_role = 'tier_selector')
             order by s.slug limit 1;
            v_items := jsonb_build_array(jsonb_build_object('role','main','service_slug',v_svc,
              'name','X','price_amount',10000,'duration_min',60,'process_min',0,'setup_min',0));

            insert into public.staff_members (slug, display_name, email, role, is_active)
            values ('ci-trazabilidad','CI','ci-trazabilidad@solmai.test','mostrador',true)
            returning id into v_actor;

            v_b := (public.create_booking('peluqueria',
              (d::text || ' 10:00-03')::timestamptz, (d::text || ' 11:00-03')::timestamptz,
              60,'fixed',10000,10000,0.20,2000,
              '{"first_name":"Traza","phone_e164":"+5493425559200"}'::jsonb,
              v_items, null, 'online')->>'id')::uuid;

            -- PRECONDICIÓN: el fixture arranca donde la prueba cree que
            -- arranca. Sin esto, un cambio en create_booking volvería
            -- verdes por accidente las cinco comprobaciones que siguen.
            select status into v_status from public.bookings where id = v_b;
            if v_status <> 'pending_payment' then
              raise exception 'fixture inválido: el turno nació %', v_status;
            end if;
            select count(*) into v_n from public.audit_log
             where entity_id = v_b and action = 'booking_status_changed';
            if v_n <> 0 then raise exception 'la precondición ya traía auditoría'; end if;

            -- 1. SIN ACTOR no se cambia el estado, y no se cambia NADA.
            v_ok := false;
            begin
              perform public.set_booking_status(v_b, 'confirmed', null, 'nadie@x.ar');
            exception when others then
              if sqlerrm like '%actor_required%' then v_ok := true; else raise; end if;
            end;
            if not v_ok then raise exception 'aceptó un cambio de estado sin persona responsable'; end if;
            select status into v_status from public.bookings where id = v_b;
            if v_status <> 'pending_payment' then raise exception 'rechazó el actor pero cambió el estado igual'; end if;

            -- 2. Una transición ilegal se rechaza nombrando ambos estados.
            v_ok := false;
            begin
              perform public.set_booking_status(v_b, 'attended', v_actor, 'ci@x.ar');
            exception when others then
              if sqlerrm like 'invalid_transition:pending_payment->attended%' then v_ok := true; else raise; end if;
            end;
            if not v_ok then raise exception 'aceptó pending_payment -> attended'; end if;

            -- 3. Una transición válida queda auditada y atribuida.
            perform public.set_booking_status(v_b, 'confirmed', v_actor, 'ci@x.ar');
            select status into v_status from public.bookings where id = v_b;
            if v_status <> 'confirmed' then raise exception 'no confirmó el turno'; end if;

            select count(*) into v_n from public.audit_log
             where entity_id = v_b and action = 'booking_status_changed'
               and actor_id = v_actor and actor_label = 'ci@x.ar';
            if v_n <> 1 then raise exception 'esperaba 1 fila de auditoría atribuida, hay %', v_n; end if;

            select detail into v_detail from public.audit_log
             where entity_id = v_b and action = 'booking_status_changed';
            if v_detail->>'previous_status' <> 'pending_payment'
               or v_detail->>'new_status' <> 'confirmed' then
              raise exception 'el registro no dice de qué estado a cuál: %', v_detail;
            end if;

            -- 4. Un estado terminal no se revierte.
            perform public.set_booking_status(v_b, 'cancelled', v_actor, 'ci@x.ar');
            v_ok := false;
            begin
              perform public.set_booking_status(v_b, 'confirmed', v_actor, 'ci@x.ar');
            exception when others then
              if sqlerrm like 'invalid_transition:cancelled->confirmed%' then v_ok := true; else raise; end if;
            end;
            if not v_ok then raise exception 'revivió un turno cancelado'; end if;

            -- 5. Cancelar sella cuándo.
            if (select cancelled_at from public.bookings where id = v_b) is null then
              raise exception 'canceló sin registrar cuándo';
            end if;

            -- 6. El guard es lo único que sostiene la propiedad: audit_log
            --    por sí solo acepta filas sin actor. Si esto dejara de ser
            --    cierto, la comprobación 1 se volvería vacía sin avisar.
            perform public.record_audit(null, null, 'ci_vacuidad', 'booking', v_b, '{}'::jsonb);
            select count(*) into v_n from public.audit_log
             where action = 'ci_vacuidad' and actor_id is null;
            if v_n <> 1 then
              raise exception 'la auditoría ya rechazaba el actor nulo: la prueba 1 no demuestra nada';
            end if;

            delete from public.audit_log where entity_id = v_b;
            delete from public.payments where booking_id = v_b;
            delete from public.bookings where id = v_b;
            delete from public.staff_members where id = v_actor;
          end $$;
          SQL

          echo "booking status traceability OK"

      - name: Verify a cancelled deposit is never left unresolved
        run: |
          set -euo pipefail

          psql "$SUPABASE_LOCAL_DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          declare
            v_svc text; v_items jsonb; d date := current_date + 300;
            v_b uuid; v_b2 uuid; v_b3 uuid; v_actor uuid;
            v_ok boolean; v_ds text; v_rd boolean; v_det jsonb;
          begin
            select s.slug into v_svc from public.services s
             where s.is_active and not exists (
               select 1 from public.service_personalization_rules x
                 join public.personalization_fields f on f.id = x.field_id
                where x.service_id = s.id and f.field_role = 'tier_selector')
             order by s.slug limit 1;
            v_items := jsonb_build_array(jsonb_build_object('role','main','service_slug',v_svc,
              'name','X','price_amount',10000,'duration_min',60,'process_min',0,'setup_min',0));

            insert into public.staff_members (slug, display_name, email, role, is_active)
            values ('ci-g15','CI','ci-g15@solmai.test','mostrador',true) returning id into v_actor;

            -- Una sola definición de la función: si una migración futura
            -- agrega un parámetro sin borrar la anterior, toda llamada
            -- queda ambigua y el panel deja de poder cambiar estados.
            if (select count(*) from pg_proc where proname = 'set_booking_status') <> 1 then
              raise exception 'hay % versiones de set_booking_status: las llamadas quedan ambiguas',
                (select count(*) from pg_proc where proname = 'set_booking_status');
            end if;

            v_b := (public.create_booking('peluqueria',
              (d::text || ' 10:00-03')::timestamptz, (d::text || ' 11:00-03')::timestamptz,
              60,'fixed',10000,10000,0.20,2000,
              '{"first_name":"G15","phone_e164":"+5493425559300"}'::jsonb,
              v_items, null, 'online')->>'id')::uuid;
            update public.bookings set status='confirmed', deposit_status='paid' where id = v_b;

            -- 1. Cancelar sin decidir el destino de la plata se rechaza,
            --    y no cambia nada.
            v_ok := false;
            begin
              perform public.set_booking_status(v_b, 'cancelled', v_actor, 'ci@x.ar');
            exception when others then
              if sqlerrm like '%deposit_outcome_required%' then v_ok := true; else raise; end if;
            end;
            if not v_ok then raise exception 'canceló una seña paga sin decidir qué pasa con la plata'; end if;
            if (select status from public.bookings where id = v_b) <> 'confirmed' then
              raise exception 'rechazó la decisión pero canceló igual';
            end if;

            -- 2. Un destino inventado tampoco pasa.
            v_ok := false;
            begin
              perform public.set_booking_status(v_b, 'cancelled', v_actor, 'ci@x.ar', 'quizas');
            exception when others then
              if sqlerrm like '%deposit_outcome_required%' then v_ok := true; else raise; end if;
            end;
            if not v_ok then raise exception 'aceptó un destino de seña que no existe'; end if;

            -- 3. Devolver deja la plata coherente.
            perform public.set_booking_status(v_b, 'cancelled', v_actor, 'ci@x.ar', 'refund');
            select deposit_status, refund_due into v_ds, v_rd from public.bookings where id = v_b;
            if v_ds <> 'refunded' or v_rd is not true then
              raise exception 'devolver dejó deposit_status=% refund_due=%', v_ds, v_rd;
            end if;

            -- 4. La auditoría guarda la decisión Y lo que habría dicho la
            --    regla automática, para que apartarse de la política sea
            --    visible en vez de invisible.
            select detail into v_det from public.audit_log
             where entity_id = v_b and action = 'booking_status_changed'
               and detail->>'new_status' = 'cancelled';
            if v_det->>'deposit_decision' <> 'refund' then
              raise exception 'no registró la decisión: %', v_det;
            end if;
            if v_det->>'rule_would_refund' is null then
              raise exception 'no registró qué habría dicho la regla: %', v_det;
            end if;
            if v_det->>'deposit_status_before' <> 'paid' then
              raise exception 'no registró el estado anterior de la seña: %', v_det;
            end if;

            -- 5. Retener también resuelve, en el otro sentido.
            v_b2 := (public.create_booking('peluqueria',
              (d::text || ' 12:00-03')::timestamptz, (d::text || ' 13:00-03')::timestamptz,
              60,'fixed',10000,10000,0.20,2000,
              '{"first_name":"G15b","phone_e164":"+5493425559301"}'::jsonb,
              v_items, null, 'online')->>'id')::uuid;
            update public.bookings set status='confirmed', deposit_status='paid' where id = v_b2;
            perform public.set_booking_status(v_b2, 'cancelled', v_actor, 'ci@x.ar', 'retain');
            select deposit_status, refund_due into v_ds, v_rd from public.bookings where id = v_b2;
            if v_ds <> 'retained' or v_rd is not false then
              raise exception 'retener dejó deposit_status=% refund_due=%', v_ds, v_rd;
            end if;

            -- 6. Donde no hay plata acreditada no se pregunta nada: la
            --    fricción aparece sólo cuando hay algo que decidir.
            v_b3 := (public.create_booking('peluqueria',
              (d::text || ' 14:00-03')::timestamptz, (d::text || ' 15:00-03')::timestamptz,
              60,'fixed',10000,10000,0,0,
              '{"first_name":"G15c","phone_e164":"+5493425559302"}'::jsonb,
              v_items, null, 'walk_in')->>'id')::uuid;
            perform public.set_booking_status(v_b3, 'cancelled', v_actor, 'ci@x.ar');
            if (select status from public.bookings where id = v_b3) <> 'cancelled' then
              raise exception 'pidió decidir donde no había plata que decidir';
            end if;

            -- 7. No queda ninguna reserva cancelada con la seña colgada.
            if exists (select 1 from public.bookings
                        where status = 'cancelled' and deposit_status = 'paid') then
              raise exception 'quedó una cancelación con la seña sin resolver';
            end if;

            delete from public.audit_log where entity_id in (v_b, v_b2, v_b3);
            delete from public.payments where booking_id in (v_b, v_b2, v_b3);
            delete from public.bookings where id in (v_b, v_b2, v_b3);
            delete from public.staff_members where id = v_actor;
          end $$;
          SQL

          echo "cancellation deposit outcome OK"

      - name: Verify assisted activity is counted without inventing time
        run: |
          set -euo pipefail

          psql "$SUPABASE_LOCAL_DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          declare
            v_from timestamptz; v_to timestamptz; r jsonb; v_n int;
          begin
            v_from := (current_date::text || ' 00:00:00-03')::timestamptz;
            v_to   := ((current_date+1)::text || ' 00:00:00-03')::timestamptz;

            delete from public.assisted_activity_daily;

            -- Arranca en cero y no rellena con nada.
            r := public.assisted_activity_summary(v_from, v_to);
            if (r->'resolved_by_system'->>'quotes')::int <> 0 then
              raise exception 'no arrancó en cero: %', r->'resolved_by_system';
            end if;

            -- LA regla del bloque: el tiempo ahorrado NO se estima. Cuánto
            -- tarda una persona en contestar una consulta lo sabe Sol, y
            -- hasta que lo diga esto vale NO DISPONIBLE, jamás un número.
            if (r->'time_saved'->>'available')::boolean is not false then
              raise exception 'declaró disponible el tiempo ahorrado sin el dato';
            end if;
            if r->'time_saved'->>'minutes' is not null then
              raise exception 'estimó minutos ahorrados: %', r->'time_saved';
            end if;

            -- Contar suma, y en el contador correcto.
            perform public.record_assisted_activity('quote_self_service');
            perform public.record_assisted_activity('quote_self_service');
            perform public.record_assisted_activity('availability_self_service');
            r := public.assisted_activity_summary(v_from, v_to);
            if (r->'resolved_by_system'->>'quotes')::int <> 2
               or (r->'resolved_by_system'->>'availability')::int <> 1 then
              raise exception 'los contadores no suman: %', r->'resolved_by_system';
            end if;

            -- Una métrica inventada se rechaza en la base, no en la app.
            begin
              perform public.record_assisted_activity('lo_que_se_me_ocurra');
              raise exception 'GATE ROTO: aceptó una métrica inexistente';
            exception when others then
              if position('GATE ROTO' in sqlerrm) > 0 then raise; end if;
            end;

            -- El día es el del SALÓN: a las 23:00 de Santa Fe ya es otro
            -- día en UTC, y una consulta del martes a la noche contaría
            -- como del miércoles.
            select count(*) into v_n from public.assisted_activity_daily
             where day = (now() at time zone 'America/Argentina/Buenos_Aires')::date;
            if v_n <> 2 then
              raise exception 'no usó el día del salón: % fila(s) en el día correcto', v_n;
            end if;

            -- Y sigue sin estimar tiempo aunque ya haya datos que contar:
            -- tener el numerador no autoriza a inventar el multiplicador.
            r := public.assisted_activity_summary(v_from, v_to);
            if (r->'time_saved'->>'available')::boolean is not false
               or r->'time_saved'->>'minutes' is not null then
              raise exception 'con datos cargados se puso a estimar tiempo: %', r->'time_saved';
            end if;

            delete from public.assisted_activity_daily;
          end $$;
          SQL

          echo "assisted activity OK"

      - name: Verify refund_due cannot contradict deposit_status
        run: |
          set -euo pipefail

          psql "$SUPABASE_LOCAL_DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          declare
            v_svc text; v_items jsonb; d date := current_date + 320;
            v_b uuid; v_actor uuid; v_ok boolean;
          begin
            select s.slug into v_svc from public.services s
             where s.is_active and not exists (
               select 1 from public.service_personalization_rules x
                 join public.personalization_fields f on f.id = x.field_id
                where x.service_id = s.id and f.field_role = 'tier_selector')
             order by s.slug limit 1;
            v_items := jsonb_build_array(jsonb_build_object('role','main','service_slug',v_svc,
              'name','X','price_amount',10000,'duration_min',60,'process_min',0,'setup_min',0));

            insert into public.staff_members (slug, display_name, email, role, is_active)
            values ('ci-g09','CI','ci-g09@solmai.test','mostrador',true) returning id into v_actor;

            v_b := (public.create_booking('peluqueria',
              (d::text || ' 10:00-03')::timestamptz, (d::text || ' 11:00-03')::timestamptz,
              60,'fixed',10000,10000,0.20,2000,
              '{"first_name":"G09","phone_e164":"+5493425559320"}'::jsonb,
              v_items, null, 'online')->>'id')::uuid;
            update public.bookings set status='confirmed', deposit_status='paid' where id = v_b;

            -- 1. Afirmar que se devuelve una seña que NO está devuelta es
            --    imposible: la base lo rechaza, no un `if` de la app.
            v_ok := false;
            begin
              update public.bookings set refund_due = true where id = v_b;
            exception when check_violation then v_ok := true;
            end;
            if not v_ok then
              raise exception 'aceptó refund_due=true con deposit_status=%',
                (select deposit_status from public.bookings where id = v_b);
            end if;

            -- 2. Y al revés: negar la devolución de una seña ya devuelta.
            update public.bookings set deposit_status='refunded', refund_due=true where id = v_b;
            v_ok := false;
            begin
              update public.bookings set refund_due = false where id = v_b;
            exception when check_violation then v_ok := true;
            end;
            if not v_ok then
              raise exception 'aceptó refund_due=false sobre una seña devuelta';
            end if;

            -- 3. NULL sigue permitido: "no se decidió" es distinto de "no
            --    corresponde devolver", y ésa es la distinción que
            --    justificó deposit_status.
            update public.bookings set refund_due = null where id = v_b;

            -- 4. El camino real —las dos juntas— sigue siendo válido.
            update public.bookings set status='confirmed', deposit_status='paid', refund_due=null where id = v_b;
            perform public.set_booking_status(v_b, 'cancelled', v_actor, 'ci@x.ar', 'refund');
            if (select refund_due from public.bookings where id = v_b) is not true
               or (select deposit_status from public.bookings where id = v_b) <> 'refunded' then
              raise exception 'la cancelación con devolución dejó un estado incoherente';
            end if;

            -- 5. Y ninguna fila del recorrido completo quedó contradictoria.
            if exists (select 1 from public.bookings
                        where refund_due is not null
                          and refund_due <> (deposit_status = 'refunded')) then
              raise exception 'quedaron filas donde refund_due contradice a deposit_status';
            end if;

            delete from public.audit_log where entity_id = v_b;
            delete from public.payments where booking_id = v_b;
            delete from public.bookings where id = v_b;
            delete from public.staff_members where id = v_actor;
          end $$;
          SQL

          echo "refund_due coherence OK"

      - name: Verify staff administration and the never-without-an-owner rule
        run: |
          set -euo pipefail

          # Este bloque NO borra sus actores al final, a diferencia del resto
          # del archivo, y el motivo es la propia regla que se está probando:
          # borrar a la última dueña está prohibido, así que el bloque no
          # puede limpiarse a sí mismo. Corre dentro de una transacción que
          # se descarta entera, que además garantiza que no deja nada atrás
          # ni siquiera si falla a la mitad.
          psql "$SUPABASE_LOCAL_DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          begin;

          do $$
          declare
            v_duena uuid;
            v_otra  uuid;
            v_r     jsonb;
          begin
            -- Quien administra tiene que ser dueña, así que la de prueba se
            -- crea con ese rol.
            insert into public.staff_members (slug, display_name, email, role, is_active)
            values ('ci-duena','CI','ci-duena@solmai.test','owner',true)
            returning id into v_duena;

            -- 1. Sumar a alguien
            v_r := public.invite_staff_member('ci-nueva@solmai.test','CI Nueva','mostrador',
                                              v_duena,'ci-duena@solmai.test');
            v_otra := (v_r->>'id')::uuid;
            if v_otra is null then
              raise exception 'invite_staff_member no creó a nadie';
            end if;
            if (v_r->>'reingreso')::boolean then
              raise exception 'una persona nueva no puede figurar como reingreso';
            end if;

            -- 2. No se duplica
            begin
              perform public.invite_staff_member('ci-nueva@solmai.test',null,'mostrador',v_duena,null);
              raise exception 'dejó sumar dos veces a la misma persona';
            exception when others then
              if sqlerrm not like '%ya_esta%' then raise; end if;
            end;

            -- 3. Quien NO es dueña no administra a nadie. Es el guard de la
            --    base, independiente del middleware de la ruta.
            --    Desde «roles por módulo» el guard es el permiso y no el
            --    rol: quien no tiene «Usuarios y roles» rebota con
            --    `sin_permiso_usuarios`, que es lo que la pantalla sabe
            --    traducir.
            begin
              perform public.invite_staff_member('ci-tercera@solmai.test',null,'mostrador',v_otra,null);
              raise exception 'quien atiende pudo sumar a alguien';
            exception when others then
              if sqlerrm not like '%sin_permiso_usuarios%' then raise; end if;
            end;
            begin
              perform public.set_staff_role(v_duena,'mostrador',v_otra,null);
              raise exception 'quien atiende pudo cambiar un rol';
            exception when others then
              if sqlerrm not like '%sin_permiso_usuarios%' then raise; end if;
            end;

            -- 4. Sacar y devolver el acceso, sobre la MISMA fila
            perform public.set_staff_active(v_otra,false,v_duena,null);
            if exists (select 1 from public.list_staff_members()
                        where id = v_otra and is_active) then
              raise exception 'sigue activa después de sacarle el acceso';
            end if;
            perform public.set_staff_active(v_otra,true,v_duena,null);
            if (select count(*) from public.staff_members
                 where lower(email)='ci-nueva@solmai.test') <> 1 then
              raise exception 'se duplicó al devolverle el acceso';
            end if;

            -- 5. Nadie se saca a sí misma: pierde la pantalla donde
            --    arreglarlo y el error queda sin salida.
            begin
              perform public.set_staff_active(v_duena,false,v_duena,null);
              raise exception 'una dueña se sacó el acceso a sí misma';
            exception when others then
              if sqlerrm not like '%no_a_vos_misma%' then raise; end if;
            end;

            -- 6. LA INVARIANTE. Un UPDATE escrito a mano —sin pasar por
            --    ninguna función— no puede dejar el salón sin dueña. Es la
            --    forma en que alguien se dejaría afuera de su propio
            --    sistema, y por eso el guard es un trigger sobre la tabla.
            begin
              update public.staff_members
                 set is_active = false
               where role = 'owner' and is_active and deleted_at is null;
              raise exception 'un UPDATE a mano dejó el salón sin ninguna dueña';
            exception when others then
              if sqlerrm not like '%sin_duena%' then raise; end if;
            end;
            begin
              update public.staff_members
                 set role = 'mostrador'
               where role = 'owner' and is_active and deleted_at is null;
              raise exception 'degradar a mano dejó el salón sin ninguna dueña';
            exception when others then
              if sqlerrm not like '%sin_duena%' then raise; end if;
            end;

            -- 7. Queda auditado, con actor
            if not exists (select 1 from public.audit_log
                            where action = 'staff_invited' and actor_id = v_duena
                              and entity_id = v_otra) then
              raise exception 'sumar a alguien no quedó auditado';
            end if;

          end $$;

          rollback;
          SQL

          echo "staff administration OK"

      - name: Verify invoicing records facts and never invents the cap
        run: |
          set -euo pipefail

          psql "$SUPABASE_LOCAL_DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          begin;

          do $$
          declare
            v_duena uuid; v_ana uuid; v_cli uuid; v_b uuid; v_n integer;
            v_cobrado integer; v_r jsonb;
          begin
            insert into public.staff_members (slug, display_name, email, role, is_active)
            values ('ci-fact','CI Facturación','ci-fact@solmai.test','owner',true)
            returning id into v_duena;
            insert into public.staff_members (slug, display_name, email, role, is_active)
            values ('ci-fact-ana','CI Ana','ci-fact-ana@solmai.test','mostrador',true)
            returning id into v_ana;

            insert into public.customers (first_name, last_name, phone_e164)
            values ('CI','Facturada','+543425559911') returning id into v_cli;

            insert into public.bookings (customer_id, area_id, starts_at, ends_at,
              shown_duration_min, status, source, price_display_mode,
              price_estimated_min, price_estimated_max, deposit_rate_applied, deposit_amount)
            values (v_cli, (select id from public.areas where slug='peluqueria'),
              now() - interval '1 day', now() - interval '1 day' + interval '1 hour',
              60, 'attended', 'phone', 'fixed', 25000, 25000, 0, 0)
            returning id into v_b;

            insert into public.service_execution_records
              (booking_id, final_price_amount, actual_duration_min, services_done, payment_method)
            values (v_b, 25000, 60, 'Corte y color', 'efectivo');

            -- 1. Lo cerrado y sin comprobante aparece, con lo que hace falta
            --    para tipearlo en ARCA. Ese es el único trabajo del bloque.
            select count(*) into v_n from public.pending_invoices() where booking_id = v_b;
            if v_n <> 1 then raise exception 'la atencion cerrada no figura sin facturar'; end if;

            -- 2. Quien no maneja Finanzas no factura ni deshace.
            begin
              perform public.mark_invoiced(v_b, 25000, current_date, null, v_ana, null);
              raise exception 'quien atiende pudo marcar una factura';
            exception when others then
              if sqlerrm not like '%sin_permiso_finanzas%' then raise; end if;
            end;

            -- 3. Un comprobante con fecha futura no existe.
            begin
              perform public.mark_invoiced(v_b, 25000, current_date + 1, null, v_duena, null);
              raise exception 'se acepto un comprobante con fecha futura';
            exception when others then
              if sqlerrm not like '%fecha_futura%' then raise; end if;
            end;

            -- 4. Un importe en cero o negativo no es un comprobante.
            begin
              perform public.mark_invoiced(v_b, 0, current_date, null, v_duena, null);
              raise exception 'se acepto un importe en cero';
            exception when others then
              if sqlerrm not like '%importe_invalido%' then raise; end if;
            end;

            -- 5. Marcar funciona, no se repite, y queda auditado.
            perform public.mark_invoiced(v_b, 25000, current_date, '00001-00000001', v_duena, null);
            select count(*) into v_n from public.pending_invoices() where booking_id = v_b;
            if v_n <> 0 then raise exception 'sigue figurando sin facturar'; end if;
            begin
              perform public.mark_invoiced(v_b, 25000, current_date, null, v_duena, null);
              raise exception 'se facturo dos veces la misma atencion';
            exception when others then
              if sqlerrm not like '%ya_facturado%' then raise; end if;
            end;
            if not exists (select 1 from public.audit_log
                            where action = 'booking_invoiced' and entity_id = v_b) then
              raise exception 'facturar no quedo auditado';
            end if;

            -- 6. Ni media marca: «facturado» sin importe no se puede escribir
            --    ni a mano, porque haría inútil el acumulado contra el tope.
            begin
              update public.service_execution_records
                 set invoiced_amount = null where booking_id = v_b;
              raise exception 'se pudo dejar una factura sin importe';
            exception when others then
              if sqlerrm not like '%invoice_coherent%' then raise; end if;
            end;

            -- 7. Deshacer existe y deja rastro: un dato fiscal que aparece y
            --    desaparece sin registro es peor que uno equivocado.
            perform public.unmark_invoiced(v_b, v_duena, null);
            if not exists (select 1 from public.audit_log
                            where action = 'booking_invoice_undone' and entity_id = v_b) then
              raise exception 'deshacer no quedo auditado';
            end if;

            -- 7b. El precio de la atención y lo que entró NO son el mismo
            --     número: `close_service` deja cerrar con saldo impago.
            --     Confundirlos metía en la lista de pendientes y en el
            --     acumulado del año plata que nunca entró.
            insert into public.payments (booking_id, provider, provider_ref,
                                         amount, status, method, kind)
            values (v_b, 'cash', 'ci-fact-parcial', 9000, 'approved', 'efectivo', 'deposit');
            select precio, cobrado into v_n, v_cobrado
              from public.pending_invoices() where booking_id = v_b;
            if v_n <> 25000 then
              raise exception 'el precio de la atencion cambio: %', v_n;
            end if;
            if v_cobrado <> 9000 then
              raise exception 'lo cobrado no sale de los pagos aprobados: %', v_cobrado;
            end if;

            -- 7c. Dos pedidos simultáneos no pueden alterar un comprobante.
            --     El lock de fila es lo único que lo impide: sin él las dos
            --     sesiones pasan el guard y la segunda pisa a la primera.
            --     La carrera de verdad se prueba con dos sesiones en
            --     scripts/sql-tests/facturacion-concurrencia.sh; acá se
            --     verifica que el lock siga estando declarado.
            if (select prosrc from pg_proc p join pg_namespace n on n.oid = p.pronamespace
                 where n.nspname = 'public' and p.proname = 'mark_invoiced')
               not like '%for update%' then
              raise exception 'mark_invoiced perdio el lock de fila';
            end if;

            -- 8. LA REGLA DEL BLOQUE: el tope de la categoría lo carga el
            --    contador de Sol. Nosotros no escribimos ningún número: un
            --    tope viejo da una tranquilidad falsa sobre una obligación
            --    fiscal, que es peor que no mostrar nada.
            if not exists (select 1 from public.business_settings
                            where key = 'monotributo_annual_cap') then
              raise exception 'falta la fila donde el contador carga el tope';
            end if;
            if (select jsonb_typeof(value) from public.business_settings
                 where key = 'monotributo_annual_cap') <> 'null' then
              raise exception 'alguien le puso un numero al tope de la categoria';
            end if;
            v_r := public.invoicing_summary();
            if (v_r->>'tope') is not null or (v_r->>'tope_cargado')::boolean then
              raise exception 'el resumen muestra un tope que nadie cargo';
            end if;

            -- 9. Cargado por el contador, lo usa. Cargado con cualquier cosa,
            --    vuelve a decir que no lo sabe.
            update public.business_settings set value = '82370281'::jsonb
             where key = 'monotributo_annual_cap';
            v_r := public.invoicing_summary();
            if (v_r->>'tope')::bigint <> 82370281 then
              raise exception 'no usa el tope que cargo el contador';
            end if;
            update public.business_settings set value = '"un monton"'::jsonb
             where key = 'monotributo_annual_cap';
            v_r := public.invoicing_summary();
            if (v_r->>'tope') is not null then
              raise exception 'invento un numero a partir de un tope ilegible';
            end if;

            -- 10. Y NO existe ninguna función que emita comprobantes. La
            --     decisión de no integrar ARCA es parte del contrato: el
            --     certificado que haría falta es el secreto más peligroso
            --     que manejaría este sistema.
            if exists (
              select 1 from pg_proc p join pg_namespace n on n.oid = p.pronamespace
               where n.nspname = 'public'
                 and (p.proname like '%afip%' or p.proname like '%arca%'
                   or p.proname like '%cae%' or p.proname like '%emitir%')
            ) then
              raise exception 'aparecio una funcion que emite comprobantes fiscales';
            end if;
          end $$;

          rollback;
          SQL

          echo "invoicing OK"

      - name: Verify module permissions cannot be widened by accident
        run: |
          set -euo pipefail

          psql "$SUPABASE_LOCAL_DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          begin;

          do $$
          declare
            v_duena  uuid;
            v_ana    uuid;
            v_enca   uuid;
            v_n      integer;
            v_slug   text;
          begin
            insert into public.staff_members (slug, display_name, email, role, is_active)
            values ('ci-roles','CI Roles','ci-roles@solmai.test','owner',true)
            returning id into v_duena;

            -- 1. La migración no le cambió el acceso a nadie. `mostrador`
            --    reproduce exactamente lo que hacía `staff`: Calendario y
            --    Clientas, y nada más. Un permiso de regalo acá es una
            --    persona viendo la plata sin que nadie lo haya decidido.
            select count(*) into v_n from public.role_permissions
             where role_slug = 'mostrador' and level <> 'none';
            if v_n <> 2 then
              raise exception 'mostrador tiene % modulos abiertos, deberian ser 2', v_n;
            end if;
            select count(*) into v_n from public.role_permissions
             where role_slug = 'mostrador' and module in ('calendario','clientas') and level = 'full';
            if v_n <> 2 then raise exception 'mostrador perdio calendario o clientas'; end if;

            -- 2. La administradora llega a todo. Si esto se pudiera
            --    recortar, el sistema quedaría sin nadie que lo arregle.
            select count(*) into v_n from public.role_permissions
             where role_slug = 'owner' and level = 'full';
            if v_n <> 9 then raise exception 'la administradora no llega a los 9 modulos'; end if;

            begin
              perform public.set_role_permission('owner','finanzas','none',v_duena,null);
              raise exception 'se le pudo recortar un modulo a la administradora';
            exception when others then
              if sqlerrm not like '%rol_del_sistema%' then raise; end if;
            end;
            begin
              perform public.delete_role('owner',v_duena,null);
              raise exception 'se pudo borrar el rol de la administradora';
            exception when others then
              if sqlerrm not like '%rol_del_sistema%' then raise; end if;
            end;

            -- 3. Un rol nuevo nace sin ver nada.
            v_slug := public.create_role('CI Recepcion',v_duena,null)->>'slug';
            select count(*) into v_n from public.role_permissions
             where role_slug = v_slug and level <> 'none';
            if v_n <> 0 then raise exception 'un rol nuevo nacio con % permisos', v_n; end if;

            -- 4. Quien no administra usuarios no reparte permisos.
            v_ana := (public.invite_staff_member('ci-ana@solmai.test','CI Ana','mostrador',
                                                 v_duena,null)->>'id')::uuid;
            begin
              perform public.set_role_permission(v_slug,'finanzas','full',v_ana,null);
              raise exception 'quien atiende pudo repartir permisos';
            exception when others then
              if sqlerrm not like '%sin_permiso_usuarios%' then raise; end if;
            end;
            begin
              perform public.create_role('CI Trucho',v_ana,null);
              raise exception 'quien atiende pudo crear un rol';
            exception when others then
              if sqlerrm not like '%sin_permiso_usuarios%' then raise; end if;
            end;

            -- 5. `can()` dice que no para lo que no se dio, y deja de
            --    decir que sí en cuanto se saca. Es la función que
            --    contesta en cada pedido: si acá se equivoca, se equivoca
            --    en todo el panel.
            if public.can(v_ana,'finanzas','view') then
              raise exception 'quien atiende ve finanzas';
            end if;
            if not public.can(v_ana,'calendario','full') then
              raise exception 'quien atiende no puede trabajar el dia';
            end if;
            perform public.set_role_permission('mostrador','finanzas','view',v_duena,null);
            if not public.can(v_ana,'finanzas','view') then
              raise exception 'dar el permiso no tuvo efecto';
            end if;
            if public.can(v_ana,'finanzas','full') then
              raise exception 'mirar alcanzo para cambiar';
            end if;
            perform public.set_role_permission('mostrador','finanzas','none',v_duena,null);
            if public.can(v_ana,'finanzas','view') then
              raise exception 'sacar el permiso no tuvo efecto';
            end if;

            -- 6. Una persona desactivada no puede nada, tenga el rol que
            --    tenga. El día que alguien deja el salón, el rol que le
            --    quedó en la fila no puede seguir abriendo puertas.
            perform public.set_staff_active(v_ana,false,v_duena,null);
            if public.can(v_ana,'calendario','view') then
              raise exception 'una persona sin acceso siguio pudiendo';
            end if;

            -- 7. Quien administra usuarios NO fabrica administradoras.
            --    Sin este corte podía nombrar administradora a un cómplice
            --    y después desactivar a la dueña: el trigger de «siempre
            --    una dueña» lo habría dejado pasar, porque ya había otra.
            perform public.set_role_permission(v_slug,'usuarios','full',v_duena,null);
            v_enca := (public.invite_staff_member('ci-enca@solmai.test','CI Encargada',v_slug,
                                                  v_duena,null)->>'id')::uuid;
            begin
              perform public.invite_staff_member('ci-complice@solmai.test',null,'owner',v_enca,null);
              raise exception 'quien administra usuarios pudo nombrar una administradora';
            exception when others then
              if sqlerrm not like '%solo_la_duena%' then raise; end if;
            end;
            begin
              perform public.set_staff_active(v_duena,false,v_enca,null);
              raise exception 'quien administra usuarios pudo sacarle el acceso a la duena';
            exception when others then
              if sqlerrm not like '%solo_la_duena%' then raise; end if;
            end;

            -- 8. Un rol que alguien tiene no se borra, ni siquiera si esa
            --    persona ya no trabaja acá: conserva el rol como parte de
            --    su historial, y la clave foránea cuenta esa fila igual.
            begin
              perform public.delete_role(v_slug,v_duena,null);
              raise exception 'se borro un rol que todavia usa alguien';
            exception when others then
              if sqlerrm not like '%rol_en_uso%' then raise; end if;
            end;

            -- 9. Todo rol asignado existe. La clave foránea es lo que
            --    impide que alguien quede apuntando a un rol fantasma y
            --    entre a nada o a todo, según cómo falle la consulta.
            select count(*) into v_n from public.staff_members s
             where not exists (select 1 from public.roles r where r.slug = s.role);
            if v_n <> 0 then raise exception '% personas con un rol que no existe', v_n; end if;

            -- 10. Repartir permisos queda auditado, con el nivel anterior.
            if not exists (
              select 1 from public.audit_log
               where action = 'role_permission_changed'
                 and detail ? 'nivel_anterior' and actor_id = v_duena
            ) then
              raise exception 'cambiar un permiso no quedo auditado';
            end if;
          end $$;

          rollback;
          SQL

          echo "module permissions OK"

      - name: Verify the audit log can be read, and only read
        run: |
          set -euo pipefail

          psql "$SUPABASE_LOCAL_DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          begin;

          do $$
          declare
            v_duena uuid;
            v_otra  uuid;
            v_n     integer;
            v_fila  record;
          begin
            insert into public.staff_members (slug, display_name, email, role, is_active)
            values ('ci-audit','CI Auditoría','ci-audit@solmai.test','owner',true)
            returning id into v_duena;

            v_otra := (public.invite_staff_member('ci-leida@solmai.test','CI Leída','mostrador',
                                                  v_duena,'ci-audit@solmai.test')->>'id')::uuid;

            -- 1. Lo que se escribió, se lee
            select count(*) into v_n from public.read_audit_log(null,null,v_duena);
            if v_n < 1 then
              raise exception 'read_audit_log no devuelve lo que se acaba de escribir';
            end if;

            -- 2. Resuelve nombres, no devuelve UUIDs pelados. Sin esto la
            --    pantalla mostraría identificadores y no serviría para nada.
            select * into v_fila from public.read_audit_log(null,null,v_duena) limit 1;
            if v_fila.quien is distinct from 'CI Auditoría' then
              raise exception 'no resolvió el nombre de quien hizo el cambio: %', v_fila.quien;
            end if;
            if v_fila.sobre is distinct from 'CI Leída' then
              raise exception 'no resolvió el nombre de la cosa cambiada: %', v_fila.sobre;
            end if;

            -- 3. Los filtros filtran.
            --
            --    Se comprueba que lo devuelto sea TODO del tipo pedido, no
            --    que el otro tipo dé cero. La primera versión afirmaba que
            --    filtrar por 'booking' devolvía cero filas, y era falso: los
            --    pasos de más arriba crean turnos y los auditan como
            --    corresponde. La aserción pasaba sólo en una base donde
            --    nadie había reservado nunca.
            select count(*) into v_n
              from public.read_audit_log(null,null,null,'staff_member');
            if v_n < 1 then raise exception 'el filtro por tipo no devuelve nada'; end if;
            select count(*) into v_n
              from public.read_audit_log(null,null,null,'staff_member')
             where entity_type is distinct from 'staff_member';
            if v_n <> 0 then
              raise exception 'el filtro por staff_member devolvió % filas de otro tipo', v_n;
            end if;
            select count(*) into v_n
              from public.read_audit_log(null,null,null,'booking')
             where entity_type is distinct from 'booking';
            if v_n <> 0 then
              raise exception 'el filtro por booking devolvió % filas de otro tipo', v_n;
            end if;

            -- 4. El tope de filas se respeta aunque pidan más
            select count(*) into v_n from public.read_audit_log(null,null,null,null,null,1);
            if v_n <> 1 then raise exception 'el limite no se respeta: %', v_n; end if;

            -- 5. NO EXISTE la contracara. Un registro que se puede retocar
            --    no sirve para lo único que sirve un registro, así que la
            --    ausencia de esas funciones es parte del contrato.
            if exists (
              select 1 from pg_proc p join pg_namespace n on n.oid = p.pronamespace
               where n.nspname = 'public'
                 and (p.proname like '%audit%delete%' or p.proname like '%delete%audit%'
                   or p.proname like '%audit%update%' or p.proname like '%update%audit%')
            ) then
              raise exception 'apareció una función para editar o borrar el registro';
            end if;
          end $$;

          rollback;
          SQL

          # Y que nadie sin privilegios pueda leerlo por la puerta de atrás.
          for rol in anon authenticated; do
            OK=$(psql "$SUPABASE_LOCAL_DB_URL" -At -c \
              "select has_function_privilege('$rol','public.read_audit_log(timestamptz,timestamptz,uuid,text,bigint,integer)','EXECUTE')")
            if [ "$OK" != "f" ]; then
              echo "::error::$rol puede ejecutar read_audit_log"; exit 1
            fi
            OK=$(psql "$SUPABASE_LOCAL_DB_URL" -At -c \
              "select has_table_privilege('$rol','public.audit_log','SELECT')")
            if [ "$OK" != "f" ]; then
              echo "::error::$rol puede leer audit_log directamente"; exit 1
            fi
          done

          echo "audit log read-only OK"

      - name: Verify field-option composite FK
        run: |
          set -euo pipefail

          psql "$SUPABASE_LOCAL_DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          declare
            v_service uuid;
            v_field uuid;
            v_wrong_option uuid;
            v_tier_field uuid;
            v_tier_service uuid;
            v_any_option uuid;
            v_accepted boolean := false;
          begin
            -- El campo tiene que ser modificable: un tier_selector (el largo)
            -- lo rechaza antes su propio trigger, y entonces esta prueba
            -- dejaría de mirar la FK compuesta. Orden explícito para que el
            -- caso bajo prueba no dependa del plan de ejecución.
            select r.service_id, r.field_id
              into v_service, v_field
            from public.service_personalization_rules r
            join public.personalization_fields f on f.id = r.field_id
            where f.field_role <> 'tier_selector'
            order by r.service_id, r.field_id
            limit 1;

            select o.id
              into v_wrong_option
            from public.personalization_options o
            where o.field_id <> v_field
            order by o.id
            limit 1;

            begin
              insert into public.service_personalization_option_modifiers
                (service_id, field_id, option_id)
              values
                (v_service, v_field, v_wrong_option);

              raise exception 'composite field/option FK accepted an invalid pair';
            exception
              when foreign_key_violation then
                null;
            end;

            -- Gate A1 en su forma directa: el largo no admite modificadores
            -- ni siquiera con un par (campo, opción) perfectamente válido.
            select r.service_id, r.field_id
              into v_tier_service, v_tier_field
            from public.service_personalization_rules r
            join public.personalization_fields f on f.id = r.field_id
            where f.field_role = 'tier_selector'
            order by r.service_id, r.field_id
            limit 1;

            if v_tier_field is null then
              raise exception 'no tier_selector field found: gate A1 would be untested';
            end if;

            select o.id into v_any_option
            from public.personalization_options o
            where o.field_id = v_tier_field
            order by o.id
            limit 1;

            begin
              insert into public.service_personalization_option_modifiers
                (service_id, field_id, option_id)
              values
                (v_tier_service, v_tier_field, v_any_option);

              v_accepted := true;
            exception
              when raise_exception then
                if position('tier_selector' in sqlerrm) = 0 then raise; end if;
            end;

            if v_accepted then
              raise exception 'gate A1 broken: the length field accepted a price modifier';
            end if;
          end
          $$;
          SQL


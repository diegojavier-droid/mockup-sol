      - name: Run repository guards
        run: |
          set -euo pipefail

          MATCHES=$(git grep -n -E 'VITE_.*(SERVICE|SECRET|TOKEN|PASSWORD|KEY)' -- . \
            ':(exclude,glob)docs/**' \
            ':(exclude,glob)**/*.md' \
            ':(exclude,glob)*.md' \
            ':(exclude)bun.lock' \
            ':(exclude).github/workflows/backend-scaffold.yml' \
            ':(exclude).github/workflows/database-clean-room.yml' \
            | grep -Ev 'VITE_SUPABASE_(PUBLISHABLE|ANON)_KEY' || true)

          if [ -n "$MATCHES" ]; then
            echo "::error::Found VITE_-prefixed secret-like names:"
            echo "$MATCHES"
            exit 1
          fi

          # src/server.ts is the Cloudflare Worker entry (wrangler main): it
          # mounts the Hono API from server/ and never ships to the browser.
          # Every other src/ file remains forbidden from importing server/.
          if command -v rg >/dev/null 2>&1; then
            SERVER_IMPORTS=$(rg -n "from ['\"].*\\bserver/" src --glob '!server.ts' || true)
          else
            SERVER_IMPORTS=$(grep -RIn -E "from ['\"].*\\bserver/" src \
              | grep -v '^src/server\.ts:' || true)
          fi

          if [ -n "$SERVER_IMPORTS" ]; then
            echo "::error::src/ must not import from server/:"
            echo "$SERVER_IMPORTS"
            exit 1
          fi

          # G-03: el cierre de una atención se escribe por un solo camino,
          # `close_service`. `service_execution_records.payment_method` es
          # una columna heredada que ese camino ya no escribe: su enum no
          # incluye `mercado_pago` y no admite pagos mixtos, así que
          # escribirla vuelve a partir en dos la verdad sobre la plata.
          # `\b` importa: `payment_methods` en plural es la LECTURA de
          # conciliación, que agrega los medios del ledger y es correcta.
          EXEC_WRITES=$(git grep -n -E "\bpayment_method\b" -- server/ src/ || true)
          EXEC_UPSERT=$(git grep -n -E "from\(\"service_execution_records\"\)\s*\.upsert|from\('service_execution_records'\)\s*\.upsert" -- server/ src/ || true)
          if [ -n "$EXEC_WRITES" ] || [ -n "$EXEC_UPSERT" ]; then
            echo "::error::el cierre de atención volvió a tener una segunda ruta de escritura (G-03):"
            echo "$EXEC_WRITES"
            echo "$EXEC_UPSERT"
            exit 1
          fi

          if git ls-files | grep -Eq '(^|/)\.env($|\.)' \
            && git ls-files | grep -Ev '(^|/)\.env\.example$' | grep -Eq '(^|/)\.env($|\.)'; then
            echo "::error::A real .env file is tracked"
            git ls-files | grep -E '(^|/)\.env($|\.)' || true
            exit 1
          fi

      - name: Exercise Hono catalog endpoints against clean-room DB
        run: |
          set -euo pipefail

          export SUPABASE_URL="$SUPABASE_LOCAL_API_URL"
          export SUPABASE_PUBLISHABLE_KEY="$SUPABASE_LOCAL_ANON_KEY"
          export SUPABASE_SERVICE_ROLE_KEY="$SUPABASE_LOCAL_SERVICE_ROLE_KEY"

          bunx tsx server/src/index.ts > /tmp/hono.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for i in $(seq 1 30); do
            if curl -fsS "http://localhost:${PORT}/api/v1/health" >/tmp/health.json 2>/dev/null; then
              break
            fi
            sleep 1
          done

          if [ ! -s /tmp/health.json ]; then
            echo "::error::Hono server did not become healthy"
            cat /tmp/hono.log || true
            exit 1
          fi

          curl -fsS "http://localhost:${PORT}/api/v1/catalog/categories" > /tmp/categories.json
          curl -fsS "http://localhost:${PORT}/api/v1/catalog/services?category=peluqueria" > /tmp/services.json
          curl -fsS "http://localhost:${PORT}/api/v1/catalog/services/corte-fem" > /tmp/service-detail.json
          curl -fsS "http://localhost:${PORT}/api/v1/catalog/extras" > /tmp/extras.json
          curl -fsS "http://localhost:${PORT}/api/v1/catalog/personalization?category=peluqueria" > /tmp/personalization.json

          bun -e '
            const checks = [
              ["/tmp/categories.json", 4],
              ["/tmp/services.json", 28],
              ["/tmp/extras.json", 13],
              ["/tmp/personalization.json", 6],
            ];
            for (const [path, expected] of checks) {
              const payload = JSON.parse(await Bun.file(path).text());
              if (!Array.isArray(payload.data) || payload.data.length !== expected) {
                throw new Error(`${path}: expected ${expected} rows, got ${payload.data?.length}`);
              }
            }
            const detail = JSON.parse(await Bun.file("/tmp/service-detail.json").text());
            if (detail.data?.slug !== "corte-fem") throw new Error("service detail contract failed");
          '

          STATUS_404=$(curl -sS -o /dev/null -w '%{http_code}' \
            "http://localhost:${PORT}/api/v1/catalog/services/no-existe")
          STATUS_400=$(curl -sS -o /dev/null -w '%{http_code}' \
            "http://localhost:${PORT}/api/v1/catalog/services?category=Not_Valid")

          test "$STATUS_404" = "404"
          test "$STATUS_400" = "400"

      - name: Run end-to-end booking flow against clean-room stack
        run: |
          set -euo pipefail

          export SUPABASE_URL="$SUPABASE_LOCAL_API_URL"
          export SUPABASE_PUBLISHABLE_KEY="$SUPABASE_LOCAL_ANON_KEY"
          export SUPABASE_SERVICE_ROLE_KEY="$SUPABASE_LOCAL_SERVICE_ROLE_KEY"
          export SUPABASE_SECRET_KEY="$SUPABASE_LOCAL_SERVICE_ROLE_KEY"
          export INTERNAL_AUTH_ALLOWED_EMAILS="ci@sol-mai.test"
          # Supabase local sólo puede emitir tokens de email+clave. La
          # política de producción sigue siendo `google` por defecto;
          # acá se abre a propósito para poder ejercitar el panel.
          export INTERNAL_AUTH_ALLOWED_PROVIDERS="email"

          # Una persona del salón, con su email CONFIRMADO: sin eso el
          # servidor la rechaza, que es justo lo que tiene que hacer.
          CREATED=$(curl -sS -X POST "$SUPABASE_LOCAL_API_URL/auth/v1/admin/users" \
            -H "apikey: $SUPABASE_LOCAL_SERVICE_ROLE_KEY" \
            -H "authorization: Bearer $SUPABASE_LOCAL_SERVICE_ROLE_KEY" \
            -H "content-type: application/json" \
            -d '{"email":"ci@sol-mai.test","password":"ci-password-1234","email_confirm":true}')
          echo "$CREATED" | head -c 200

          TOKEN=$(curl -sS -X POST "$SUPABASE_LOCAL_API_URL/auth/v1/token?grant_type=password" \
            -H "apikey: $SUPABASE_LOCAL_ANON_KEY" \
            -H "content-type: application/json" \
            -d '{"email":"ci@sol-mai.test","password":"ci-password-1234"}' \
            | bun -e 'const j=JSON.parse(await Bun.stdin.text()); console.log(j.access_token ?? "")')

          if [ -z "$TOKEN" ]; then
            echo "::error::no se pudo obtener un token de staff en CI"
            exit 1
          fi

          bunx tsx server/src/index.ts > /tmp/hono-e2e.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for i in $(seq 1 30); do
            curl -fsS "http://localhost:${PORT}/api/v1/health" >/dev/null 2>&1 && break
            sleep 1
          done
          if ! curl -fsS "http://localhost:${PORT}/api/v1/health" >/dev/null 2>&1; then
            echo "::error::el servidor no levantó para el E2E"
            cat /tmp/hono-e2e.log || true
            exit 1
          fi

          # Que el panel responda ANTES de correr las suites: si el token
          # no sirviera, los E2E fallarían por la razón equivocada y el
          # diagnóstico sería otro.
          ME=$(curl -sS -o /tmp/me.json -w '%{http_code}' \
            -H "authorization: Bearer $TOKEN" \
            "http://localhost:${PORT}/api/v1/admin/me")
          if [ "$ME" != "200" ]; then
            echo "::error::el token de staff no abre el panel (HTTP $ME)"
            cat /tmp/me.json || true
            cat /tmp/hono-e2e.log || true
            exit 1
          fi

          export SOLMAI_E2E_BASE="http://localhost:${PORT}"
          export SOLMAI_E2E_STAFF_TOKEN="$TOKEN"
          export SOLMAI_E2E_DB_URL="$SUPABASE_LOCAL_DB_URL"

          bash scripts/e2e-flow.sh
          bash scripts/e2e-stations.sh
          bash scripts/e2e-combo.sh

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup || true

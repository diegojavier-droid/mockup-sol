name: Deploy Cloudflare Worker

# Se publica solo al mergear a `main`.
#
# Antes esto era `workflow_dispatch` a secas: el despliegue sólo ocurría
# si una persona entraba a GitHub y apretaba el botón. El resultado era
# que el sitio publicado se quedaba viejo sin que nadie se diera cuenta,
# porque nada avisa de un despliegue que no ocurrió. `main` es la línea
# estable del proyecto; si algo llegó ahí, es porque tiene que estar
# publicado.
#
# El botón manual sigue existiendo, para reintentar un despliegue que
# falló o para volver a publicar después de cargar una variable.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Dos merges seguidos no pueden pisarse: el segundo espera al primero en
# vez de publicar los dos al mismo tiempo y dejar vaya a saber cuál.
# No se cancela el que está en curso — un despliegue a medias es peor
# que uno de más.
concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Sol Mai web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      # El build genera su propia configuración en dist/server, con el
      # Worker compilado y el directorio de assets del navegador. La
      # configuración de la raíz apunta al fuente y NO declara assets:
      # desplegar con ella publica un sitio sin estilos ni javascript.
      - name: Comprobar que el build dejó su configuración
        run: |
          set -euo pipefail
          test -f dist/server/wrangler.json || {
            echo "::error::el build no generó dist/server/wrangler.json"; exit 1; }
          test -d dist/client || {
            echo "::error::el build no generó dist/client (assets del navegador)"; exit 1; }

      # La acción de Cloudflare aborta el despliegue entero si un secreto
      # de la lista llega vacío: «Value for secret X not found in
      # environment». Así que la lista se arma en función de lo que
      # realmente existe, en vez de nombrar siempre todo y confiar en que
      # esté cargado.
      #
      # Consecuencia buscada: mientras Mercado Pago no esté configurado el
      # sitio se despliega igual y el pago online muestra su mensaje. El
      # día que se carguen las credenciales, se suben solas sin tocar este
      # archivo.
      - name: Armar la lista de secretos según lo que esté cargado
        id: secretos
        env:
          MP_TOKEN: ${{ secrets.MERCADO_PAGO_ACCESS_TOKEN }}
          MP_WEBHOOK: ${{ secrets.MERCADO_PAGO_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          LISTA=$'SUPABASE_URL\nSUPABASE_PUBLISHABLE_KEY\nSUPABASE_SECRET_KEY\nINTERNAL_AUTH_ALLOWED_EMAILS\nAPI_BASE_URL\nPUBLIC_WEB_BASE_URL'

          if [ -n "${MP_TOKEN:-}" ]; then
            LISTA="$LISTA"$'\nMERCADO_PAGO_ACCESS_TOKEN'
            echo "Mercado Pago: access token presente, se publica."
          else
            echo "Mercado Pago: sin access token; el pago online queda deshabilitado."
          fi

          if [ -n "${MP_WEBHOOK:-}" ]; then
            LISTA="$LISTA"$'\nMERCADO_PAGO_WEBHOOK_SECRET'
            echo "Mercado Pago: clave de webhook presente, se publica."
          else
            echo "Mercado Pago: sin clave de webhook; el webhook rechazará todo."
          fi

          # Un token cargado sin su clave de webhook es peor que nada: se
          # le cobraría a la clienta y ninguna notificación podría
          # confirmar el turno, porque sin firma verificable se rechaza.
          if [ -n "${MP_TOKEN:-}" ] && [ -z "${MP_WEBHOOK:-}" ]; then
            echo "::error::MERCADO_PAGO_ACCESS_TOKEN está cargado pero falta MERCADO_PAGO_WEBHOOK_SECRET. Con esa combinación se cobra y el turno nunca se confirma."
            exit 1
          fi

          {
            echo "lista<<FIN_DE_LISTA"
            echo "$LISTA"
            echo "FIN_DE_LISTA"
          } >> "$GITHUB_OUTPUT"

      - name: Deploy with Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config dist/server/wrangler.json
          # Se cargan en el Worker antes de publicar. El propietario los
          # define una sola vez en los secrets del repositorio y nunca
          # pasan por un chat ni quedan en el código.
          secrets: ${{ steps.secretos.outputs.lista }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          INTERNAL_AUTH_ALLOWED_EMAILS: ${{ secrets.INTERNAL_AUTH_ALLOWED_EMAILS }}
          # La dirección definitiva se conoce recién después del primer
          # despliegue. Hasta que se cargue, se usa la del Worker.
          API_BASE_URL: ${{ vars.PUBLIC_WEB_BASE_URL || 'https://sol-mai-peluqueria.workers.dev' }}
          PUBLIC_WEB_BASE_URL: ${{ vars.PUBLIC_WEB_BASE_URL || 'https://sol-mai-peluqueria.workers.dev' }}
          # Mercado Pago. Sólo se suben si el paso anterior los puso en la
          # lista; acá se exponen para que, cuando eso pase, la acción
          # encuentre el valor.
          MERCADO_PAGO_ACCESS_TOKEN: ${{ secrets.MERCADO_PAGO_ACCESS_TOKEN }}
          MERCADO_PAGO_WEBHOOK_SECRET: ${{ secrets.MERCADO_PAGO_WEBHOOK_SECRET }}

      - name: Dónde quedó publicado
        run: |
          echo "### Sol Mai publicado" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "La dirección aparece arriba, en la salida de Wrangler, como \`https://sol-mai-peluqueria.<algo>.workers.dev\`." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Cargala como variable de repositorio \`PUBLIC_WEB_BASE_URL\` y volvé a ejecutar este workflow, para que los links que genera el sistema apunten al lugar correcto." >> "$GITHUB_STEP_SUMMARY"
